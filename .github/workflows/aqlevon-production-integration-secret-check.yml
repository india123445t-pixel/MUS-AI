name: AQLEVON Production Integration Secret Readiness
on:
  push:
    branches: [main]
    paths: [".github/runpod-control/production-integration-secret-check.json"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Record secret presence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,time
          out={
            "kind":"AQLEVON_PRODUCTION_INTEGRATION_SECRET_PRESENCE_V1",
            "runpod_api_key_configured":bool(os.environ.get("RUNPOD_API_KEY")),
            "vercel_token_configured":bool(os.environ.get("VERCEL_TOKEN")),
            "supabase_access_token_configured":bool(os.environ.get("SUPABASE_ACCESS_TOKEN")),
            "checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          p=pathlib.Path(".github/runpod-control/production-integration-secret-presence.json")
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Persist result
        run: |
          git config user.name aqlevon-runtime-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/production-integration-secret-presence.json
          git commit -m "ops: record production integration secret presence [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
