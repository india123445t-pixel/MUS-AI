name: AQLEVON Auth09 RSFT Free Seal
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/one-day-rsft-crystallization-free-trigger-09.json"]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AUTH_ID: P4-ONE-DAY-RSFT-CRYSTALLIZATION-20260925-09
      AUTH_SHA: 76bdd6d24ba6007c3bc702568f026dfcf4d69d44a85f129510d127844f6adcc6
      SOURCE_HEAD: 7b35fab86da22e46804e9af6f311a88ea5b02e27
      SOURCE_BLOB: 930e6742f15b77cfa4653485ea7be91d1d965fcb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Validate Auth09 contract and source
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/runpod-control/run-one-day-rsft-crystallization-09.sh
          bash -n .github/runpod-control/auth09-rsft-crystallization-remote-v1.sh
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          a=json.loads(Path('.github/runpod-control/one-day-rsft-crystallization-manager-authorization-09-20260925.json').read_text())
          sha=hashlib.sha256(json.dumps({k:v for k,v in a.items() if k!='authorization_sha256'},sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert sha==a['authorization_sha256']==os.environ['AUTH_SHA']
          assert a['authorization_id']==os.environ['AUTH_ID']
          assert a['expected_source_head']==os.environ['SOURCE_HEAD']
          assert a['candidate_source_blob']==os.environ['SOURCE_BLOB']
          assert a['training_authorized'] is True and a['single_use'] is True
          assert a['train_discovery_tasks']==28 and a['train_families']==14 and a['epochs']==3 and a['mining_n']==8 and a['max_on_policy_per_task']==1 and a['minimum_optimizer_updates']==84
          assert a['public_shadow_tasks']==28
          assert float(a['fresh_authorization_spend_before_auth09_usd'])+float(a['max_total_cost_usd'])<=float(a['mission_max_total_usd'])
          assert not Path('.github/runpod-control/one-day-rsft-crystallization-consumed-09.json').exists()
          print('AQLEVON_AUTH09_CONTRACT_PASS',sha)
          PY
          git fetch -q origin "$SOURCE_HEAD"
          blob="$(git rev-parse "$SOURCE_HEAD:research/weight_factory/agent03/p4_one_day_rsft_crystallize.py")"
          test "$blob" = "$SOURCE_BLOB"
          git show "$SOURCE_HEAD":research/weight_factory/agent03/p4_one_day_rsft_crystallize.py >/tmp/rsft.py
          python3 -m py_compile /tmp/rsft.py
          grep -q '^MAX_TRAIN_EXAMPLES = 28$' /tmp/rsft.py
          grep -q '^EPOCHS = 3$' /tmp/rsft.py
          grep -q '^MINING_N = 8$' /tmp/rsft.py
          grep -q '^MAX_ON_POLICY_PER_TASK = 1$' /tmp/rsft.py
          grep -q 'for epoch in range(EPOCHS)' /tmp/rsft.py
          grep -q 'optimizer_update_accounting_mismatch' /tmp/rsft.py
          grep -q 'AQLEVON_SEALED_EVAL_PATH' /tmp/rsft.py
          grep -q 'public_discovery_oracle_full_coverage' /tmp/rsft.py
          echo AQLEVON_AUTH09_SOURCE_CONTRACT_PASS
      - name: Seal provider state without spend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          curl -sSL https://cli.runpod.net | sudo bash >/dev/null
          runpodctl user >/tmp/user.json
          runpodctl gpu list --output json >/tmp/gpus.json
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          a=json.load(open('.github/runpod-control/one-day-rsft-crystallization-manager-authorization-09-20260925.json'))
          pods=json.load(open('/tmp/pods.json')); pods=pods if isinstance(pods,list) else pods.get('pods') or pods.get('items') or []
          active=[p for p in pods if str(p.get('name','')).startswith('AQLEVON-') and str(p.get('desiredStatus') or p.get('status'))!='EXITED']
          assert not active,active
          balances=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower().replace('_','') in ('balance','currentbalance','creditbalance','clientbalance') and type(v) in (int,float): balances.append(float(v))
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(json.load(open('/tmp/user.json'))); assert balances
          allowed=set(a['permitted_gpu_ids']); choices=[]
          for g in json.load(open('/tmp/gpus.json')):
              gid=str(g.get('gpuId',''))
              if gid not in allowed or not g.get('secureCloud'): continue
              price=float(g.get('securePricePerHr') or 999)
              if price>float(a['max_hourly_rate_usd']): continue
              for d in (g.get('dataCenterAvailability') or []):
                  if str(d.get('stockStatus')).lower()!='none' and d.get('dataCenterId'):
                      secs=min(int(a['max_billed_seconds']),int(float(a['max_total_cost_usd'])*3600/price))
                      if secs>=1200: choices.append((price,gid,str(d['dataCenterId']),secs))
          assert choices,'no_cost_safe_auth09_gpu_stock'
          price,gpu,dc,secs=sorted(choices)[0]
          out={'kind':'AQLEVON_ONE_DAY_RSFT_CRYSTALLIZATION_FREE_SEAL_V1',
               'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'authorization_id':os.environ['AUTH_ID'],'authorization_sha256':os.environ['AUTH_SHA'],
               'source_head':os.environ['SOURCE_HEAD'],'balance_usd':max(balances),'active_aqlevon_pods':[],
               'selected_gpu_id':gpu,'selected_datacenter':dc,'selected_price_hr':price,
               'dynamic_max_billed_seconds':secs,'paid_resource_created':False}
          Path('.github/runpod-control/one-day-rsft-crystallization-free-result-09.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('AQLEVON_AUTH09_FREE_SEAL_PASS',json.dumps(out,sort_keys=True))
          PY
      - name: Persist Auth09 free seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/one-day-rsft-crystallization-free-result-09.json
          git commit -m "ops: record Auth09 RSFT free seal [skip ci]" || true
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
