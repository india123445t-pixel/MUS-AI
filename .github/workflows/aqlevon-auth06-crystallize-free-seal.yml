name: AQLEVON Auth06 Crystallization Free Seal
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/auth06-crystallize-free-trigger.json"]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Validate authorization and live provider without spend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path(".github/runpod-control/one-day-crystallize-manager-authorization-06-20260925.json")
          a=json.loads(p.read_text())
          raw={k:v for k,v in a.items() if k!="authorization_sha256"}
          sha=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert sha==a["authorization_sha256"]=="421795be22ddc505daade0e763a19e642f5ac115dfe1f877df8f0c99cb9dda48"
          assert a["authorization_id"]=="P4-ONE-DAY-CRYSTALLIZE-20260925-06"
          assert a["training_authorized"] is True and a["single_use"] is True
          assert a["sealed_eval_consumed"] is False and a["worker05_used_for_tuning"] is False
          assert float(a["fresh_authorization_spend_before_auth06_usd"])+float(a["max_total_cost_usd"]) <= float(a["owner_fresh_mission_authorization_usd"])
          assert not Path(".github/runpod-control/one-day-crystallize-consumed-06.json").exists()
          print("AQLEVON_AUTH06_CONTRACT_PASS",sha)
          PY
          test "$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/agent/03-one-day-crystallization-20260925 | cut -f1)" = "b3bb3901b7f50e028e5939c55195ebf347551777"
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          curl -sSL https://cli.runpod.net | sudo bash >/dev/null
          runpodctl user >/tmp/user.json
          runpodctl gpu list --output json >/tmp/gpus.json
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          a=json.load(open(".github/runpod-control/one-day-crystallize-manager-authorization-06-20260925.json"))
          pods=json.load(open("/tmp/pods.json")); pods=pods if isinstance(pods,list) else pods.get("pods") or pods.get("items") or []
          active=[p for p in pods if str(p.get("name","")).startswith("AQLEVON-") and str(p.get("desiredStatus") or p.get("status"))!="EXITED"]
          assert not active,active
          balances=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower().replace("_","") in ("balance","currentbalance","creditbalance","clientbalance") and type(v) in (int,float): balances.append(float(v))
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(json.load(open("/tmp/user.json"))); assert balances
          balance=max(balances)
          choices=[]; allowed=set(a["permitted_gpu_ids"])
          for g in json.load(open("/tmp/gpus.json")):
              gid=str(g.get("gpuId",""))
              if gid not in allowed or not g.get("secureCloud"): continue
              price=float(g.get("securePricePerHr") or 999)
              if price>float(a["max_hourly_rate_usd"]): continue
              for d in (g.get("dataCenterAvailability") or []):
                  if str(d.get("stockStatus")).lower()!="none":
                      seconds=min(int(a["max_billed_seconds"]),int(float(a["max_total_cost_usd"])*3600/price))
                      if seconds>=1200: choices.append((price,gid,d.get("dataCenterId"),seconds))
          assert choices,"no_cost_safe_gpu_stock"
          price,gpu,dc,seconds=sorted(choices)[0]
          out={"kind":"AQLEVON_AUTH06_CRYSTALLIZATION_FREE_SEAL_V1",
               "checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "authorization_id":a["authorization_id"],"authorization_sha256":a["authorization_sha256"],
               "source_head":a["crystallization_source_head"],"balance_usd":balance,
               "active_aqlevon_pods":[],"selected_gpu_id":gpu,"selected_datacenter":dc,
               "selected_price_hr":price,"dynamic_max_billed_seconds":seconds,"paid_resource_created":False}
          Path(".github/runpod-control/auth06-crystallize-free-result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("AQLEVON_AUTH06_FREE_SEAL_PASS",json.dumps(out,sort_keys=True))
          PY
      - name: Persist free seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/auth06-crystallize-free-result.json
          git commit -m "ops: record Auth06 crystallization free seal [skip ci]" || true
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
