name: AQLEVON Actions Heartbeat
on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/heartbeat-trigger.json"
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Write heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/runpod-control
          python - <<'PY'
          import json,datetime,os
          out={"ok":True,"github_run_id":os.environ.get("GITHUB_RUN_ID"),"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open(".github/runpod-control/heartbeat-result.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name aqlevon-actions-heartbeat
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/heartbeat-result.json
          git commit -m "ops: record Actions heartbeat [skip ci]"
          git push origin HEAD:ops/runpod-control-v1
