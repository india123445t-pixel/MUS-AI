name: AQLEVON Auth05 Recovery Crystallization Preflight
on:
  push:
    branches: [agent/03-one-day-crystallization-20260925]
    paths: ["research/weight_factory/agent03/auth05_recovery_preflight_trigger.json"]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/03-one-day-crystallization-20260925
          fetch-depth: 0
      - name: Validate exact Auth05 recovery input and public-only training boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/weight_factory/agent03/p4_one_day_crystallize.py
          git fetch -q origin abb94ef134e2e97036b6959dbc9db4278d3736b6
          git show abb94ef134e2e97036b6959dbc9db4278d3736b6:research/weight_factory/agent02/gene1_training_visible_pack_v1.json >/tmp/public-pack.json
          git show abb94ef134e2e97036b6959dbc9db4278d3736b6:research/weight_factory/agent02/gene1_data_verifier_pack_v1.py >/tmp/w02.py
          python3 research/weight_factory/agent03/p4_one_day_crystallize.py             --probe-result research/weight_factory/agent03/auth05_recovered_material_decision.json             --w02-module /tmp/w02.py             --training-pack /tmp/public-pack.json             --preflight-only | tee /tmp/recovery-preflight.log
          grep -q 'train_verified=6 shadow=28' /tmp/recovery-preflight.log
          grep -q 'MATERIAL_LATENT_CAPABILITY' /tmp/recovery-preflight.log
          grep -q 'AQLEVON_ONE_DAY_PUBLIC_PASSN_PROBE_RECOVERED_DECISION_V1' /tmp/recovery-preflight.log
          echo AQLEVON_AUTH05_RECOVERY_CRYSTALLIZATION_PREFLIGHT_PASS
