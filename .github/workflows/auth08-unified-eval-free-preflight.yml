name: Auth08 Unified Eval Free Preflight

on:
  push:
    branches: [manager/auth08-unified-eval-20260927]
    paths:
      - "research/evaluation/auth08_unified_public_eval_runner_v1.py"
      - "ops/auth08-eval/bootstrap.sh"
      - "ops/auth08-eval/run-auth08-unified-eval.sh"
      - "ops/auth08-eval/eval-reservation.py"
      - "ops/auth08-eval/finalize.sh"
      - ".github/workflows/auth08-unified-public-eval-control.yml"
      - ".github/workflows/auth08-unified-eval-free-preflight.yml"
      - "ops/auth08-eval/free-preflight-trigger.json"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch historical refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin 4e3f1b03cfe77ac4355907ec692574f30d180252 || true
          git fetch --no-tags origin abb94ef134e2e97036b6959dbc9db4278d3736b6 || true
      - name: Syntax
        run: |
          set -euo pipefail
          python3 -m py_compile research/evaluation/auth08_unified_public_eval_runner_v1.py
          python3 -m py_compile ops/auth08-eval/eval-reservation.py
          bash -n ops/auth08-eval/bootstrap.sh
          bash -n ops/auth08-eval/run-auth08-unified-eval.sh
          bash -n ops/auth08-eval/finalize.sh
          python3 - <<'PY'
          import pathlib
          text=pathlib.Path(".github/workflows/auth08-unified-public-eval-control.yml").read_text()
          assert "cancel-in-progress: false" in text
          assert "actions/upload-artifact@v4" in text
          assert "Finalize durable upload and delete pod" in text
          print("AQLEVON_AUTH08_EVAL_WORKFLOW_STATIC_PASS")
          PY
          echo AQLEVON_AUTH08_UNIFIED_EVAL_SYNTAX_PASS
      - name: Frozen Agent04 tests
        run: |
          set -euo pipefail
          python3 research/weight_factory/agent04/test_aqlevon_27b_public_generalization_challenge_v1.py
          python3 research/weight_factory/agent04/test_aqlevon_27b_public_generalization_result_harness_v1.py
      - name: Frozen Agent03 contract
        run: |
          set -euo pipefail
          python3 research/weight_factory/agent03/aqlevon_27b_rerun_contract_v1.py verify
      - name: Reproduce and close bundle ownership extraction defect
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/src" "$tmp/dst"
          printf 'auth08-eval-bundle-smoke\n' > "$tmp/src/payload.txt"
          tar --owner=1001 --group=1001 -czf "$tmp/bundle.tgz" -C "$tmp/src" .
          tar --no-same-owner -xzf "$tmp/bundle.tgz" -C "$tmp/dst"
          test "$(cat "$tmp/dst/payload.txt")" = "auth08-eval-bundle-smoke"
          grep -F 'tar --no-same-owner -xzf "$BUNDLE" -C "$ROOT/bundle"' ops/auth08-eval/bootstrap.sh
          echo AQLEVON_AUTH08_EVAL_NO_SAME_OWNER_EXTRACTION_PASS
      - name: Static Auth08 runner contract
        run: |
          set -euo pipefail
          grep -F 'EXPECTED_ADAPTER_SHA256 = "5ed9a22e963eca99f5ebd00f13a46fa6afadd9b74bb9d2e501b23c1ff9219c74"' research/evaluation/auth08_unified_public_eval_runner_v1.py
          grep -F 'EXPECTED_GENERALIZATION_MANIFEST_SHA256 = "25fa2777010255bd8d91431632ba65d72355340086250fe4bce8dffa64e33b0f"' research/evaluation/auth08_unified_public_eval_runner_v1.py
          grep -F 'EXPECTED_PAIRED_BINDING_SHA256 = "b5f26e20bcdd13cead301623cc5e3496e231b32418a98c895e31db5dfdf9a888"' research/evaluation/auth08_unified_public_eval_runner_v1.py
          grep -F 'if done != 352' research/evaluation/auth08_unified_public_eval_runner_v1.py
          grep -F 'total_model_dispatches": 352' research/evaluation/auth08_unified_public_eval_runner_v1.py
          grep -F 'runpodctl receive "$TRANSFER_CODE"' ops/auth08-eval/bootstrap.sh
          grep -F 'sealed_eval_consumed": False' research/evaluation/auth08_unified_public_eval_runner_v1.py
          grep -F 'MAX_ELAPSED=3300' ops/auth08-eval/run-auth08-unified-eval.sh
          grep -F 'price*3300/3600<=1.50' ops/auth08-eval/run-auth08-unified-eval.sh
          grep -F 'runpodctl send "$BUNDLE"' ops/auth08-eval/run-auth08-unified-eval.sh
          grep -F 'runpodctl receive "$TRANSFER_CODE"' ops/auth08-eval/bootstrap.sh
          grep -F 'AQLEVON_AUTH08_EVAL_DURABLE_ARTIFACT_BEFORE_DELETE_PASS' ops/auth08-eval/finalize.sh
          echo AQLEVON_AUTH08_UNIFIED_EVAL_STATIC_PASS
