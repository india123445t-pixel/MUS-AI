name: Auth08 Eval Live Monitor

on:
  push:
    branches: [coord/aqlevon-accel-wave-20260927]
    paths:
      - ".github/workflows/auth08-eval-live-monitor.yml"
      - ".github/auth08-eval-monitor/trigger.json"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: a6hxcy4h40l5gd
    steps:
      - name: Read pod and runtime status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://rest.runpod.io/v1/pods/$POD_ID"             -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pod.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/pod.json"))
          keep={k:d.get(k) for k in ["id","name","desiredStatus","status","costPerHr","adjustedCostPerHr","createdAt","lastStatusChange","machineId","gpuCount","gpuTypeId","dataCenterId","imageName"]}
          print("AQLEVON_AUTH08_EVAL_MONITOR_POD",json.dumps(keep,sort_keys=True))
          PY
          code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://$POD_ID-8000.proxy.runpod.net/status.json?t=$(date +%s)" || true)"
          echo "AQLEVON_AUTH08_EVAL_MONITOR_HTTP $code"
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          print("AQLEVON_AUTH08_EVAL_MONITOR_RUNTIME",json.dumps(d,sort_keys=True))
          PY
          fi
          curl -fL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 90 \
            https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 \
            -o /tmp/runpodctl >/dev/null 2>&1 || true
          if [ -s /tmp/runpodctl ]; then
            chmod +x /tmp/runpodctl
            /tmp/runpodctl pod logs "$POD_ID" --tail 100 >/tmp/pod.log 2>/tmp/pod.err || true
            python3 - <<'PY'
          from pathlib import Path
          for line in Path("/tmp/pod.log").read_text(errors="replace").splitlines()[-100:]:
              print("AQLEVON_AUTH08_EVAL_MONITOR_LOG",line[:3000])
          err=Path("/tmp/pod.err").read_text(errors="replace").strip()
          if err: print("AQLEVON_AUTH08_EVAL_MONITOR_LOGERR",err[:3000])
          PY
          fi
