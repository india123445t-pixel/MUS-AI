name: AQLEVON Manager 27B Live Monitor

on:
  push:
    branches: [coord/aqlevon-accel-wave-20260927]
    paths:
      - ".github/manager-monitor/27b-live-trigger-*.json"
      - ".github/workflows/manager-27b-live-monitor.yml"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Query active AQLEVON 27B pod
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pods.json
          python3 - <<'PY' > /tmp/monitor.json
          import json
          p=json.load(open("/tmp/pods.json"))
          xs=p if isinstance(p,list) else p.get("pods") or p.get("items") or []
          hits=[]
          for x in xs:
              name=str(x.get("name") or "")
              status=str(x.get("desiredStatus") or x.get("status") or "")
              if name.startswith("AQLEVON-27B-R0") and status!="EXITED":
                  hits.append(x)
          out={"count":len(hits)}
          if hits:
              x=hits[-1]
              out.update({
                  "pod_id":str(x.get("id") or ""),
                  "status":str(x.get("desiredStatus") or x.get("status") or ""),
                  "cost_per_hr":x.get("costPerHr"),
                  "created_at":str(x.get("createdAt") or "")
              })
          print(json.dumps(out))
          PY
          cat /tmp/monitor.json
          COUNT="$(python3 -c 'import json; print(json.load(open("/tmp/monitor.json"))["count"])')"
          if [ "$COUNT" = "0" ]; then
            echo AQLEVON_MANAGER_MONITOR_NO_ACTIVE_POD
            exit 0
          fi
          POD_ID="$(python3 -c 'import json; print(json.load(open("/tmp/monitor.json"))["pod_id"])')"
          python3 - <<'PY'
          import json,datetime
          d=json.load(open("/tmp/monitor.json"))
          print("AQLEVON_MANAGER_MONITOR_POD",json.dumps(d,sort_keys=True))
          PY
          code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://${POD_ID}-8000.proxy.runpod.net/status.json?t=$(date +%s)" || true)"
          echo "AQLEVON_MANAGER_MONITOR_HTTP $code"
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          keep={k:d.get(k) for k in ["kind","stage","rc","detail","model_name","status","optimizer_updates","baseline_dev_successes","final_dev_successes","baseline_shadow_successes","final_shadow_successes","adapter_sha256","manifest_sha256"] if k in d}
          print("AQLEVON_MANAGER_MONITOR_RUNTIME",json.dumps(keep,sort_keys=True))
          PY
          fi
          curl -sS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pod-detail.json || echo '{}' >/tmp/pod-detail.json
          python3 - <<'PY'
          import json
          try: d=json.load(open("/tmp/pod-detail.json"))
          except Exception: d={}
          keep={k:d.get(k) for k in ["name","desiredStatus","status","containerStatus","gpuCount","gpuTypeId","dataCenterId","costPerHr","createdAt","lastStatusChange","portMappings","imageName"] if k in d}
          print("AQLEVON_MANAGER_MONITOR_DETAIL",json.dumps(keep,sort_keys=True))
          PY
          RUNPODCTL_URL="https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64"
          curl -fL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 90 "$RUNPODCTL_URL" -o /tmp/runpodctl >/dev/null 2>&1 || true
          if [ -s /tmp/runpodctl ]; then
            chmod +x /tmp/runpodctl
            /tmp/runpodctl pod logs "$POD_ID" --tail 120 >/tmp/pod.log 2>/tmp/pod.err || true
            python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path("/tmp/pod.log").read_text(errors="replace").splitlines()[-120:]
          for line in lines:
              line=re.sub(r'rpa_[A-Za-z0-9_-]+','<REDACTED_RUNPOD_KEY>',line)
              line=re.sub(r'gh[pousr]_[A-Za-z0-9_]+','<REDACTED_GITHUB_TOKEN>',line)
              print("AQLEVON_MANAGER_MONITOR_LOG",line[:3000])
          err=Path("/tmp/pod.err").read_text(errors="replace").strip()
          if err: print("AQLEVON_MANAGER_MONITOR_LOGERR",err[:3000])
          PY
          fi
