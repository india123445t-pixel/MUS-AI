name: Agent03 P4 CPU Gate

on:
  push:
    branches:
      - agent/03-p4-gene1-physical-trainer
  pull_request:
    branches:
      - agent/03-p3-g1-ready
    paths:
      - 'research/weight_factory/agent03/**'
      - '.github/workflows/agent03-p4-cpu-gate.yml'

permissions:
  contents: read

jobs:
  p4-agent03-cpu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/weight_factory/agent03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile P4 Python
        run: |
          python -m py_compile             p4_gene1_trainer.py             p4_aqlevon_reward.py             p4_surrogate_tournament.py             p4_sft_surrogate.py             test_p4_gene1_trainer.py
      - name: Parse frozen JSON
        run: |
          python - <<'PY'
          import json
          for p in [
              'p4_method_spec.schema.json',
              'p4_frozen_training_plan_v1.json',
              'p4_a1_seed1701_run_manifest_v1.json',
              'p4_a1_seed1701_command_lock_v1.json',
          ]:
              json.load(open(p, encoding='utf-8'))
              print('JSON_PASS', p)
          PY
      - name: Run P4 CPU contract tests
        run: python -m unittest -v test_p4_gene1_trainer.py
      - name: Verify final A1 identities
        run: |
          python - <<'PY'
          import json
          import p4_gene1_trainer as c
          import p4_surrogate_tournament as t
          from pathlib import Path
          plan_path=Path('p4_frozen_training_plan_v1.json')
          run=json.load(open('p4_a1_seed1701_run_manifest_v1.json',encoding='utf-8'))
          lock=json.load(open('p4_a1_seed1701_command_lock_v1.json',encoding='utf-8'))
          assert c.verify_self_digest(run,'manifest_sha256')
          assert c.verify_self_digest(lock,'lock_sha256')
          argv=t.build_a1_argv(plan_path,Path('/workspace'))
          assert c.canonical_sha256(argv)==run['command_sha256']==lock['command_sha256']
          assert lock['run_manifest_sha256']==run['manifest_sha256']
          assert lock['training_plan_sha256']==run['training_plan_sha256']
          assert lock['g1_rerun'] is False and lock['automatic_fallback'] is False
          print('A1_IDENTITY_PASS',run['manifest_sha256'],lock['lock_sha256'])
          PY

      - name: Verify Retry18 runtime-repair bootstrap
        run: |
          set -euo pipefail
          bash -n p4_runpod_retry18_bootstrap.sh
          python - <<'PY'
          import json
          from pathlib import Path
          import p4_gene1_trainer as c
          a=json.loads(Path("p4_a1_runpod_manager_authorization_retry18_v1.json").read_text())
          assert c.verify_self_digest(a,"authorization_sha256")
          assert a["authorization_id"]=="P4-A1-RUNPOD-4090-20260920-18-REWARD-RUNTIME-CLOSURE"
          assert a["authorization_sha256"]=="55ef1e64e55eda44b5e9e8779754628562e9674865c65950551d972c3a4d7ad6"
          assert a["run_manifest_sha256"]=="7152cdea6ffd082f632a819e153122b401bd7394ed0273a327537ca961c7fe45"
          assert a["max_billed_seconds"]==1800 and a["max_total_cost_usd"]=="0.40"
          b=Path("p4_runpod_retry18_bootstrap.sh").read_text()
          for needle in (
              "python -m pip install -q --disable-pip-version-check --no-deps -e \"$SDPO\"",
              "flash_attn-2.8.3%2Bcu12torch2.8cxx11abi",
              "f25da18657a87fc83dc1bfb8b7751b82246e9db355510226b674fd437c34b5fb",
              "2605b2653e7b9d6615bbb154896ae4d3f0b95d3120af7a6374ee97092e61df02",
              "FLASH_ATTN_4090_BF16_HD256_FWD_BWD_PASS",
          ):
              assert needle in b, needle
          print("RETRY17_CPU_CONTRACT_PASS")
          PY

      - name: Verify immutable appliance launcher contract
        run: |
          set -euo pipefail
          bash -n p4_runpod_appliance_launch.sh
          python - <<'PY'
          from pathlib import Path
          p=Path("p4_runpod_appliance_launch.sh").read_text()
          for forbidden in ("pip install","git clone -q https://github.com/lasgroup/SDPO.git"):
              assert forbidden not in p, forbidden
          for required in (
              "AQLEVON_EXPECTED_IMAGE_DIGEST",
              "runtime_appliance_digest",
              "runtime_appliance_required",
              "smoke_runtime.py --build-check --gpu-check",
              "APPLIANCE_EXACT_AUTHORIZATION_PASS",
              "A1_LOCKED_TRAINING_START",
          ):
              assert required in p, required
          print("APPLIANCE_LAUNCHER_CONTRACT_PASS")
          PY

  p4-runtime-appliance-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk for CUDA image build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Build immutable runtime appliance locally
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build             --load             --provenance=false             --sbom=false             -f research/weight_factory/agent03/runtime_appliance/Dockerfile             -t aqlevon-p4-a1-w03:ci             .
          IMAGE_ID="$(docker image inspect aqlevon-p4-a1-w03:ci --format '{{.Id}}')"
          test -n "$IMAGE_ID"
          echo "AQLEVON_APPLIANCE_LOCAL_IMAGE_ID=$IMAGE_ID"

      - name: Smoke immutable runtime appliance
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm aqlevon-p4-a1-w03:ci             python /opt/aqlevon/runtime/smoke_runtime.py --build-check
