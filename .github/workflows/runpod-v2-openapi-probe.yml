name: RunPod v2 OpenAPI Permission Probe

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/runpod-v2-openapi-probe-trigger.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect OpenAPI paths without exposing secret
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          curl -fsS --retry 2 --max-time 30             -H "Authorization: Bearer $RUNPOD_API_KEY"             https://api.runpod.io/v2/openapi.json -o /tmp/openapi.json
          python - <<'PY'
          import json,re
          d=json.load(open('/tmp/openapi.json'))
          out=[]
          for path, item in (d.get('paths') or {}).items():
              blob=(path+' '+json.dumps(item,sort_keys=True)).lower()
              if any(k in blob for k in ['api key','api-key','apikey','permission','credential','auth key','access key']):
                  methods=[m.upper() for m in item if m.lower() in {'get','post','put','patch','delete'}]
                  out.append({'path':path,'methods':methods})
          print('RUNPOD_V2_SECURITY_PATHS',json.dumps(out,sort_keys=True))
          print('RUNPOD_V2_PATH_COUNT',len(d.get('paths') or {}))
          PY
