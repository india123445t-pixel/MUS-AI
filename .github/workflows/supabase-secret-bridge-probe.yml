name: Supabase Secret Bridge Probe

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/supabase-secret-bridge-probe-trigger.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Report secret presence only
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json,os
          names=[
            "RUNPOD_API_KEY","SUPABASE_ACCESS_TOKEN","SUPABASE_SERVICE_ROLE_KEY",
            "SUPABASE_PROJECT_REF","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          ]
          print("SUPABASE_SECRET_BRIDGE_PRESENCE",json.dumps({k:bool(os.getenv(k)) for k in names},sort_keys=True))
          PY
