name: AQLEVON 27B Auth16 Transfer Free Preflight
on:
  push:
    branches: [agent/03-aqlevon27b-auth16-transfer-20260926]
    paths: [".github/aqlevon27b-free-trigger.json"]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/03-aqlevon27b-auth16-transfer-20260926
      - name: Validate source and public-only recipe
        shell: bash
        run: |
          set -euo pipefail
          CAND=research/weight_factory/agent03/p4_one_day_synthetic_curriculum.py
          BOOT=.github/runpod-control/aqlevon27b-auth16-transfer-bootstrap.sh
          python3 -m py_compile "$CAND"
          bash -n "$BOOT"
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          p=Path("research/weight_factory/agent03/p4_one_day_synthetic_curriculum.py")
          s=p.read_text()
          assert 'MODEL_REPO = "Qwen/Qwen3.8-27B"' in s
          assert 'MODEL_REV = "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"' in s
          assert 'LAYERS = tuple(range(3, 64, 4))' in s
          assert 'LR = 1e-5' in s and 'MIN_LR = 1e-6' in s
          assert '"PUBLICLY_VERIFIED_27B_CANDIDATE"' in s
          assert "sealed_eval_consumed\":False" in s
          print("AQLEVON_27B_SOURCE_STATIC_PASS")
          PY
          curl -fsSL "https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/config.json" -o /tmp/config.json
          python3 - <<'PY'
          import json
          c=json.load(open("/tmp/config.json"))
          assert c["architectures"]==["Qwen3_5ForConditionalGeneration"]
          t=c["text_config"]
          assert t["hidden_size"]==5120
          assert len(t["layer_types"])==64
          full=[i for i,x in enumerate(t["layer_types"]) if x=="full_attention"]
          assert full==list(range(3,64,4)),full
          assert t["dtype"]=="bfloat16"
          print("AQLEVON_27B_OFFICIAL_TOPOLOGY_PASS",full)
          PY
          curl -fsSL "https://raw.githubusercontent.com/india123445t-pixel/MUS-AI/abb94ef134e2e97036b6959dbc9db4278d3736b6/research/weight_factory/agent02/gene1_training_visible_pack_v1.json" -o /tmp/public-pack.json
          curl -fsSL "https://raw.githubusercontent.com/india123445t-pixel/MUS-AI/abb94ef134e2e97036b6959dbc9db4278d3736b6/research/weight_factory/agent02/gene1_data_verifier_pack_v1.py" -o /tmp/w02.py
          curl -fsSL "https://raw.githubusercontent.com/india123445t-pixel/MUS-AI/529e665ea140c2f8d6b96c02a42c100e9075c037/research/weight_factory/agent03/p4_one_day_recovered_materializer.py" -o /tmp/materializer.py
          curl -fsSL "https://raw.githubusercontent.com/india123445t-pixel/MUS-AI/529e665ea140c2f8d6b96c02a42c100e9075c037/research/weight_factory/agent03/auth05_recovered_material_decision.json" -o /tmp/recovered.json
          python3 /tmp/materializer.py --recovered-decision /tmp/recovered.json --training-pack /tmp/public-pack.json --output /tmp/probe.json >/tmp/materializer.log
          python3 - <<'PY'
          import json
          p="/tmp/probe.json"; d=json.load(open(p))
          d["model_repo"]="Qwen/Qwen3.8-27B"; d["model_revision"]="1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          json.dump(d,open(p,"w"),indent=2,sort_keys=True)
          PY
          python3 "$CAND" --probe-result /tmp/probe.json --w02-module /tmp/w02.py --training-pack /tmp/public-pack.json --preflight-only | tee /tmp/preflight.log
          grep -q 'synthetic=672 dev=28 shadow=28 families=14 updates=672' /tmp/preflight.log
          echo AQLEVON_27B_FREE_PREFLIGHT_PASS
