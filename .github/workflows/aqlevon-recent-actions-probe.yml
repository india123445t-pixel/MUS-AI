name: AQLEVON Recent Actions Probe

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/recent-actions-trigger.json"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Query recent Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50"             -o /tmp/runs.json
          python - <<'PY'
          import json,datetime
          raw=json.load(open('/tmp/runs.json'))
          out={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"runs":[]}
          for r in raw.get("workflow_runs",[])[:50]:
              out["runs"].append({
                "id":r.get("id"),
                "name":r.get("name"),
                "status":r.get("status"),
                "conclusion":r.get("conclusion"),
                "event":r.get("event"),
                "head_branch":r.get("head_branch"),
                "head_sha":r.get("head_sha"),
                "created_at":r.get("created_at"),
                "updated_at":r.get("updated_at"),
                "run_number":r.get("run_number")
              })
          open(".github/runpod-control/recent-actions.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/recent-actions.json
          git commit -m "ops: record recent Actions runs [skip ci]" || true
          git pull --rebase origin ops/runpod-control-v1 || true
          git push origin HEAD:ops/runpod-control-v1 || true
