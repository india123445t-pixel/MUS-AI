name: AQLEVON Cancel Stale Run

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/cancel-stale-run-trigger.json"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Cancel exact workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(jq -r '.run_id' .github/runpod-control/cancel-stale-run-trigger.json)"
          test "$run_id" = "35764447318"
          curl -sS -f -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/cancel"
          echo "FORCE_CANCEL_REQUESTED=$run_id"
