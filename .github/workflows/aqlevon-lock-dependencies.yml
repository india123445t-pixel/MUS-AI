name: AQLEVON Lock Dependencies

on:
  push:
    branches:
      - aqlevon/zero-cost-hardening
    paths:
      - .github/workflows/aqlevon-lock-dependencies.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aqlevon/zero-cost-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patched PostCSS floor
        run: npm pkg set overrides.postcss=8.5.23
      - name: Generate deterministic lockfile
        run: npm install --ignore-scripts --no-fund
      - name: Security and regression gate
        run: |
          npm audit --audit-level=low
          npm run bos:check
          npm run bos:test
          npm run build
      - name: Commit only dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "lock patched AQLEVON dependency tree"
          git push origin HEAD:aqlevon/zero-cost-hardening
