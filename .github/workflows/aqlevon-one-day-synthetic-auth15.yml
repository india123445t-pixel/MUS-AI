name: AQLEVON One-Day Synthetic Curriculum Auth15
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/execute-one-day-synthetic-curriculum-15.json"]
permissions:
  contents: write
concurrency:
  group: aqlevon-p4-paid-single-use
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Derive and seal Auth15 driver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path(".github/runpod-control/run-one-day-rsft-crystallization-09.sh").read_text()
          reps={
            "one-day-rsft-crystallization-manager-authorization-09-20260925.json":"one-day-synthetic-curriculum-manager-authorization-15-20260925.json",
            "one-day-rsft-crystallization-free-result-09.json":"one-day-synthetic-curriculum-free-result-15.json",
            "execute-one-day-rsft-crystallization-09.json":"execute-one-day-synthetic-curriculum-15.json",
            "one-day-rsft-crystallization-consumed-09.json":"one-day-synthetic-curriculum-consumed-15.json",
            "one-day-rsft-crystallization-run-result-09.json":"one-day-synthetic-curriculum-run-result-15.json",
            "one-day-rsft-crystallization-live-selection-09.json":"one-day-synthetic-curriculum-live-selection-15.json",
            "P4-ONE-DAY-RSFT-CRYSTALLIZATION-20260925-09":"P4-ONE-DAY-SYNTHETIC-CURRICULUM-20260925-15",
            "76bdd6d24ba6007c3bc702568f026dfcf4d69d44a85f129510d127844f6adcc6":"6635c323573b54327171b31b9ae1506ab4f2c3bf176bf2ebc6f3a442cfd008cf",
            "7b35fab86da22e46804e9af6f311a88ea5b02e27":"22b95b0fdfaf97c3ba3314a94c2413d45439cc6e",
            "930e6742f15b77cfa4653485ea7be91d1d965fcb":"cb86e6494fada78328310dfe5900e75205862ee0",
            "auth09-rsft-crystallization-remote-v1.sh":"auth15-synthetic-curriculum-remote-v1.sh",
            "AQLEVON-ONE-DAY-RSFT-09":"AQLEVON-ONE-DAY-SYNTH-15",
            "p4_one_day_rsft_crystallize.py":"p4_one_day_synthetic_curriculum.py",
            "fresh_authorization_spend_before_auth09_usd":"conservative_mission_spend_before_auth15_usd",
            "AQLEVON_ONE_DAY_RSFT_CRYSTALLIZATION_RUN_RECEIPT_V1":"AQLEVON_ONE_DAY_SYNTHETIC_CURRICULUM_RUN_RECEIPT_V1"
          }
          for a,b in reps.items(): s=s.replace(a,b)
          s=s.replace("AUTH09","AUTH15").replace("Auth09","Auth15").replace("auth09","auth15")
          s=s.replace('assert a["max_total_cost_usd"]=="0.70" and a["max_hourly_rate_usd"]=="1.60" and a["max_billed_seconds"]==1500',
                      'assert a["max_total_cost_usd"]=="0.70" and a["max_hourly_rate_usd"]=="1.60" and a["max_billed_seconds"]==1500')
          s=s.replace('assert a["train_discovery_tasks"]==28 and a["train_families"]==14 and a["epochs"]==3 and a["mining_n"]==8 and a["max_on_policy_per_task"]==1 and a["minimum_optimizer_updates"]==84',
                      'assert a["synthetic_examples"]==672 and a["discovery_dev_tasks"]==28 and a["epochs"]==1 and a["minimum_optimizer_updates"]==672 and a["lora_rank"]==8 and a["lora_alpha"]==16 and a["lora_targets"]==["q_proj","k_proj","v_proj","o_proj"] and a["runtime_proven_trainable_parameters"]==1572864')
          s=s.replace('train_verified=28 shadow=28 epochs=3 minimum_updates=84 probe_decision=MATERIAL_LATENT_CAPABILITY',
                      'AQLEVON_SYNTH_PUBLIC_PREFLIGHT_PASS synthetic=672 dev=28 shadow=28 families=14 updates=672 probe_decision=MATERIAL_LATENT_CAPABILITY')
          s=s.replace('--data-center-ids "$(cat /tmp/selected_dc08)" ','')
          s=s.replace('"selected_datacenter":dc,"selected_price_hr":price',
                      '"selected_datacenter":"UNPINNED_ANY_AVAILABLE","observed_capacity_datacenter":dc,"selected_price_hr":price')
          s=s.replace('--volume-in-gb 40 --volume-mount-path /workspace ','')
          s=s.replace('[ "$elapsed" -lt 600 ] || break','[ "$elapsed" -lt 180 ] || break')
          s=s.replace('git add .github/runpod-control/one-day-synthetic-curriculum-live-selection-15.json\ngit commit -m "ops: persist Auth15 RSFT live selection before spend [skip ci]"\ngit push origin HEAD:ops/one-day-verified-trajectory-20260925\n\n','')
          s=s.replace('git add "$CONSUMED"','git add "$CONSUMED" .github/runpod-control/one-day-synthetic-curriculum-live-selection-15.json')
          Path("/tmp/run-auth15.sh").write_text(s)
          PY
          bash -n /tmp/run-auth15.sh
          grep -q 'P4-ONE-DAY-SYNTHETIC-CURRICULUM-20260925-15' /tmp/run-auth15.sh
          grep -q 'p4_one_day_synthetic_curriculum.py' /tmp/run-auth15.sh
          grep -q 'synthetic_examples.*672' /tmp/run-auth15.sh
          grep -q 'one-day-synthetic-curriculum-live-selection-15.json' /tmp/run-auth15.sh
          grep -q 'AQLEVON-ONE-DAY-SYNTH-15' /tmp/run-auth15.sh
          ! grep -q -- '--volume-in-gb' /tmp/run-auth15.sh
          ! grep -q -- '--data-center-ids' /tmp/run-auth15.sh
          grep -q 'UNPINNED_ANY_AVAILABLE' /tmp/run-auth15.sh
          grep -q 'assert free>=70000' /tmp/run-auth15.sh
      - name: Execute bounded Auth15 synthetic curriculum
        shell: bash
        run: bash /tmp/run-auth15.sh
      - name: Upload Auth15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqlevon-one-day-synthetic-curriculum-auth15
          path: |
            /tmp/auth15-evidence.tgz
            /tmp/auth15-train.log
            /tmp/auth15_rc
            /tmp/create08.json
            /tmp/pod08.json
            /tmp/auth15-input-sha256.txt
            /tmp/stop08.json
            /tmp/delete08.json
            /tmp/auth15-exit-stop.json
            /tmp/auth15-exit-delete.json
          if-no-files-found: warn
          retention-days: 14
