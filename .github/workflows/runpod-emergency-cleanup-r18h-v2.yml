name: RunPod Emergency Cleanup AQLEVON 27B R0

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/emergency-cleanup-r18h-v2-trigger.json"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install runpodctl
        run: curl -sSL https://cli.runpod.net | sudo bash

      - name: Stop and delete exact AQLEVON 27B R0 pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="y6hkpr1bu32t1s"
          runpodctl pod stop "$POD_ID" --output json || true
          sleep 2
          runpodctl pod delete "$POD_ID" --output json || true
          echo "POST_CLEANUP_STATE"
          runpodctl pod list --all --output json | jq '[.[] | select(.id=="y6hkpr1bu32t1s" or .name=="AQLEVON-27B-R0-BUDGET8-04") | {id,name,status:(.status // .desiredStatus),costPerHr}]'
