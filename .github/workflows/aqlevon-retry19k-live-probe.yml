name: AQLEVON Retry19K Live Probe

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/retry19k-live-probe-trigger.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Capture active P4 pod log tail
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -f "https://rest.runpod.io/v1/pods" -H "Authorization: Bearer $RUNPOD_API_KEY" > /tmp/pods.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/pods.json'))
          pods=p if isinstance(p,list) else p.get('pods') or p.get('items') or []
          active=[x for x in pods if str(x.get('name') or '').startswith('AQLEVON-P4-A1-Retry19I') and str(x.get('desiredStatus') or x.get('status'))!='EXITED']
          if len(active)!=1:
              raise SystemExit('active_retry19i_count:'+str(len(active)))
          x=active[0]
          open('/tmp/pod_id','w').write(str(x.get('id')))
          open('/tmp/pod_state.json','w').write(json.dumps({'id':x.get('id'),'name':x.get('name'),'desiredStatus':x.get('desiredStatus'),'costPerHr':x.get('costPerHr')},sort_keys=True))
          PY
          curl -sSL https://cli.runpod.net | sudo bash
          set +e
          runpodctl pod get "$(cat /tmp/pod_id)" --output json > /tmp/pod-get.json 2>/tmp/pod-get.err
          runpodctl pod logs "$(cat /tmp/pod_id)" --tail 100 --source container --max-wait 12s > /tmp/live.jsonl 2>/tmp/live.err
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          details={}
          try:
              raw=json.loads(Path('/tmp/pod-get.json').read_text())
              runtime=raw.get('runtime') or {}
              gpus=runtime.get('gpus') or []
              details={
                  'runtime_status':raw.get('runtimeStatus') or raw.get('runtime_status'),
                  'desired_status':raw.get('desiredStatus') or raw.get('desired_status'),
                  'uptime_seconds':runtime.get('uptimeInSeconds') or runtime.get('uptime_in_seconds'),
                  'gpus':[{
                      'gpu_util_percent':g.get('gpuUtilPercent') or g.get('gpu_util_percent'),
                      'memory_util_percent':g.get('memoryUtilPercent') or g.get('memory_util_percent')
                  } for g in gpus],
                  'container':{
                      'cpu_percent':(runtime.get('container') or {}).get('cpuPercent'),
                      'memory_percent':(runtime.get('container') or {}).get('memoryPercent')
                  },
                  'runtime_keys': sorted(runtime.keys()),
                  'raw_gpu_runtime': runtime.get('gpus') or runtime.get('gpu') or raw.get('gpus') or raw.get('gpu')
              }
          except Exception:
              details={'pod_get_error':Path('/tmp/pod-get.err').read_text(errors='replace')[-800:]}
          out={'pod':json.loads(Path('/tmp/pod_state.json').read_text()),'details':details,'lines':[],'stderr':Path('/tmp/live.err').read_text(errors='replace')[-1000:]}
          for line in Path('/tmp/live.jsonl').read_text(errors='replace').splitlines():
              try:
                  x=json.loads(line)
                  out['lines'].append({'ts':x.get('ts'),'line':str(x.get('line',''))[-1600:]})
              except Exception:
                  pass
          Path('.github/runpod-control/retry19k-live-probe-result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/retry19k-live-probe-result.json
          git commit -m "ops: record live Retry19I probe [skip ci]" || true
          git push origin HEAD:ops/runpod-control-v1
