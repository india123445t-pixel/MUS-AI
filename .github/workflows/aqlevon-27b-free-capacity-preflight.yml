name: AQLEVON 27B Free Capacity Preflight

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/capacity-preflight-trigger-*.json"

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Verify paid script syntax and no literal newline corruption
        run: |
          set -euo pipefail
          bash -n .github/runpod-control/run-aqlevon-27b-r0-budget8.sh
          bash -n .github/runpod-control/aqlevon-27b-r0-bootstrap.sh
          if grep -F '\\n' .github/runpod-control/run-aqlevon-27b-r0-budget8.sh; then
            echo "::error::literal backslash-n found in paid script"
            exit 1
          fi
          grep -F 'MAX_ELAPSED=3350' .github/runpod-control/run-aqlevon-27b-r0-budget8.sh
          grep -F -- '--volume-in-gb 100' .github/runpod-control/run-aqlevon-27b-r0-budget8.sh
          grep -F 'CLAIMS_DIR/${AUTH_ID}.reservation.json' .github/runpod-control/run-aqlevon-27b-r0-budget8.sh
          grep -F 'EXPECTED_CURRENT_TRAINER_BLOB=9085e692d43110600e7bf214ffdab910f4821f1c' .github/runpod-control/run-aqlevon-27b-r0-budget8.sh
          grep -F 'tee "$ROOT/train.log"' .github/runpod-control/aqlevon-27b-r0-bootstrap.sh
          echo AQLEVON_27B_PAID_SCRIPT_SYNTAX_PASS
      - name: Verify no active AQLEVON 27B pod
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/pods.json"))
          xs=p if isinstance(p,list) else p.get("pods") or p.get("items") or []
          active=[]
          for x in xs:
              name=str(x.get("name") or "")
              status=str(x.get("desiredStatus") or x.get("status") or "")
              if name.startswith("AQLEVON-27B-R0") and status!="EXITED":
                  active.append({"name":name,"status":status})
          assert not active,active
          print("AQLEVON_27B_FREE_PREFLIGHT_NO_ACTIVE_POD_PASS")
          PY
      - name: Install runpodctl
        run: |
          set -euo pipefail
          RUNPODCTL_URL="https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64"
          RUNPODCTL_TMP="/tmp/aqlevon-runpodctl"
          rm -f "$RUNPODCTL_TMP"
          for attempt in 1 2 3 4 5; do
            if curl -fL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 90 "$RUNPODCTL_URL" -o "$RUNPODCTL_TMP"; then
              break
            fi
            rm -f "$RUNPODCTL_TMP"
            sleep $((attempt * 2))
          done
          test -s "$RUNPODCTL_TMP"
          sudo install -m 0755 "$RUNPODCTL_TMP" /usr/local/bin/runpodctl
          runpodctl version
          runpodctl pod create --help >/tmp/pod-create-help.txt
          grep -F -- '--volume-in-gb' /tmp/pod-create-help.txt
          grep -F -- '--volume-mount-path' /tmp/pod-create-help.txt
          echo AQLEVON_27B_VOLUME_FLAGS_PASS
      - name: Verify per-authorization claim ledger free-only
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          for id in TEST-AQLEVON-AUTH-0001 TEST-AQLEVON-AUTH-0002; do
            cat >"$tmp/$id.auth.json" <<JSON
          {
            "kind": "AQLEVON_MANAGER_PAID_AUTHORIZATION_V2",
            "control_plane_contract": "AQLEVON_27B_CONTROL_PLANE_V2",
            "authorization_id": "$id",
            "issued_at_utc": "2026-09-27T00:00:00Z",
            "fresh_authorization": true,
            "single_use": true,
            "training_authorized": true,
            "scientific_contract_sha256": "484c369ee9e4d19d1142f4d55cce4296a594d49697d5cf47afa13f31da0a283d",
            "automatic_cleanup_required": true,
            "artifact_preservation_required": true,
            "no_main_merge": true,
            "sealed_eval_forbidden": true
          }
          JSON
            python3 .github/runpod-control/aqlevon-27b-reservation.py reserve \
              --authorization "$tmp/$id.auth.json" \
              --reservation "$tmp/$id.reservation.json" \
              --consumed "$tmp/$id.consumed.json" \
              --run-id 123 --run-attempt 1 \
              --source-sha 0123456789abcdef0123456789abcdef01234567 \
              --expected-authorization-id "$id"
          done
          test -s "$tmp/TEST-AQLEVON-AUTH-0001.reservation.json"
          test -s "$tmp/TEST-AQLEVON-AUTH-0002.reservation.json"
          echo AQLEVON_27B_PER_AUTH_CLAIM_LEDGER_PASS
      - name: Check A100 80GB secure capacity under ceiling
        run: |
          set -euo pipefail
          runpodctl gpu list --output json >/tmp/gpus.json
          python3 - <<'PY'
          import json
          choices=[]
          for g in json.load(open("/tmp/gpus.json")):
              if str(g.get("gpuId"))!="NVIDIA A100-SXM4-80GB" or not g.get("secureCloud"):
                  continue
              price=float(g.get("securePricePerHr") or 999)
              if price>1.60:
                  continue
              for d in g.get("dataCenterAvailability") or []:
                  if str(d.get("stockStatus") or "").lower()=="none" or not d.get("dataCenterId"):
                      continue
                  choices.append((price,str(d["dataCenterId"]),str(d.get("stockStatus"))))
          assert choices,"no_a100_sxm_80_stock_under_ceiling"
          price,dc,stock=sorted(choices)[0]
          print("AQLEVON_27B_FREE_CAPACITY_PASS",price,dc,stock)
          PY
