name: AQLEVON W05 Secret Presence Probe
on:
  push:
    branches: [ops/aqlevon-27b-r0-20260926]
    paths: [".github/workflows/aqlevon-w05-secret-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AQLEVON_EVAL_SECRET: ${{ secrets.AQLEVON_EVAL_SECRET }}
      AQLEVON_SEALED_EVAL: ${{ secrets.AQLEVON_SEALED_EVAL }}
      AQLEVON_SEALED_EVAL_B64: ${{ secrets.AQLEVON_SEALED_EVAL_B64 }}
      AQLEVON_GENE1_EVAL_SECRET: ${{ secrets.AQLEVON_GENE1_EVAL_SECRET }}
      AQLEVON_GENE1_SEALED_EVAL_B64: ${{ secrets.AQLEVON_GENE1_SEALED_EVAL_B64 }}
      WORKER05_EVAL_SECRET: ${{ secrets.WORKER05_EVAL_SECRET }}
      WORKER05_SEALED_EVAL: ${{ secrets.WORKER05_SEALED_EVAL }}
      P4_W05_EVAL_SECRET: ${{ secrets.P4_W05_EVAL_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/aqlevon-27b-r0-20260926
          fetch-depth: 0
      - name: Probe without revealing secret values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/runpod-control
          python3 - <<'PY'
          import os,base64,hashlib,json,datetime
          from pathlib import Path
          expected_secret="e61883f5f794ed6e82bb29b5718b09334ed2f29fa60bc5c1b7f7c6e1e86a8db6"
          expected_plain="ce17cdee667f2a53adf38000f2ace652cc1b4659187640a49f04858dceadbd0e"
          names=[
            "AQLEVON_EVAL_SECRET","AQLEVON_SEALED_EVAL","AQLEVON_SEALED_EVAL_B64",
            "AQLEVON_GENE1_EVAL_SECRET","AQLEVON_GENE1_SEALED_EVAL_B64",
            "WORKER05_EVAL_SECRET","WORKER05_SEALED_EVAL","P4_W05_EVAL_SECRET"
          ]
          rows=[]
          matched=[]
          for name in names:
            v=os.environ.get(name,"")
            row={"name":name,"present":bool(v),"raw_expected_secret_match":False,"raw_expected_plain_match":False,
                 "base64_expected_secret_match":False,"base64_expected_plain_match":False}
            if v:
              raw=v.encode()
              h=hashlib.sha256(raw).hexdigest()
              row["raw_expected_secret_match"]=h==expected_secret
              row["raw_expected_plain_match"]=h==expected_plain
              try:
                dec=base64.b64decode(v,validate=True)
                hd=hashlib.sha256(dec).hexdigest()
                row["base64_expected_secret_match"]=hd==expected_secret
                row["base64_expected_plain_match"]=hd==expected_plain
              except Exception:
                pass
              if any(row[k] for k in row if k.endswith("_match")): matched.append(name)
            rows.append(row)
          out={
            "kind":"AQLEVON_W05_SECRET_PRESENCE_PROBE_V1",
            "checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "expected_eval_secret_file_sha256":expected_secret,
            "expected_sealed_plaintext_file_sha256":expected_plain,
            "candidates":rows,
            "matched_secret_names":matched,
            "any_candidate_present":any(r["present"] for r in rows),
            "exact_known_hash_match":bool(matched),
            "secret_values_exposed":False
          }
          Path(".github/runpod-control/aqlevon-w05-secret-probe-result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("AQLEVON_W05_SECRET_PROBE",json.dumps({"any_candidate_present":out["any_candidate_present"],"exact_known_hash_match":out["exact_known_hash_match"],"matched_secret_names":matched}))
          PY
      - name: Persist probe receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-manager-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/aqlevon-w05-secret-probe-result.json
          git commit -m "ops: record W05 secret presence probe [skip ci]" || true
          git pull --rebase origin ops/aqlevon-27b-r0-20260926
          git push origin HEAD:ops/aqlevon-27b-r0-20260926
