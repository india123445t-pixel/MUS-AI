name: AQLEVON Auth16 Cleanup Verify
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/auth16-cleanup-verify-trigger.json"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: eocv1vol38jqlg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Verify exact Auth16 Pod absent
        shell: bash
        run: |
          set -euo pipefail
          pod="$POD_ID"
          code="$(curl -sS -o /tmp/pre.json -w '%{http_code}' "https://rest.runpod.io/v1/pods/$pod" -H "Authorization: Bearer $RUNPOD_API_KEY" || true)"
          existed_before=true
          if [ "$code" = "404" ]; then
            existed_before=false
          else
            curl -sS -X POST "https://rest.runpod.io/v1/pods/$pod/stop" -H "Authorization: Bearer $RUNPOD_API_KEY" -H 'Content-Type: application/json' -d '{}' >/tmp/stop.json || true
            sleep 2
            curl -sS -X DELETE "https://rest.runpod.io/v1/pods/$pod" -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/delete.json || true
          fi
          deleted=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/final.json -w '%{http_code}' "https://rest.runpod.io/v1/pods/$pod" -H "Authorization: Bearer $RUNPOD_API_KEY" || true)"
            if [ "$code" = "404" ]; then deleted=1; break; fi
            sleep 2
          done
          test "$deleted" = "1"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "authorization_id":"P4-ONE-DAY-SYNTHETIC-CURRICULUM-20260925-16",\n  "checked_at_utc":"%s",\n  "existed_before_cleanup_check":%s,\n  "kind":"AQLEVON_AUTH16_INDEPENDENT_CLEANUP_RECEIPT_V1",\n  "pod_id":"eocv1vol38jqlg",\n  "stopped_and_deleted":true\n}\n' "$now" "$existed_before" > .github/runpod-control/auth16-independent-cleanup-result.json
          echo "AQLEVON_AUTH16_CLEANUP_VERIFY_PASS pod=$pod existed_before=$existed_before"
      - name: Persist receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/auth16-independent-cleanup-result.json
          git commit -m "ops: record Auth16 independent cleanup verification [skip ci]" || true
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
