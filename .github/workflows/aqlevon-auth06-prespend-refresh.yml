name: AQLEVON Auth06 Live Capacity Pre-Spend Refresh
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/auth06-prespend-refresh-trigger.json"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AQLEVON_PRESPEND_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Revalidate all Auth06 gates and persist live selection without Pod
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/runpod-control/run-one-day-crystallize-06.sh
          bash .github/runpod-control/run-one-day-crystallize-06.sh
          test ! -e .github/runpod-control/one-day-crystallize-consumed-06.json
          echo AQLEVON_AUTH06_LIVE_PRESPEND_REFRESH_WORKFLOW_PASS
