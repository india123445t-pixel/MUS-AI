name: Auth08 Eval Live Monitor 02

on:
  push:
    branches: [manager/auth08-unified-eval-20260927]
    paths:
      - ".github/workflows/auth08-eval-live-monitor-02.yml"
      - "ops/auth08-eval/monitor-trigger-02.json"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_ID: hjwspv5aqtnqxd
    steps:
      - name: Read Auth02 pod and runtime status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pod.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/pod.json"))
          keep={k:d.get(k) for k in ["id","name","desiredStatus","status","costPerHr","adjustedCostPerHr","createdAt","lastStatusChange","machineId","gpuCount","gpuTypeId","dataCenterId","imageName"]}
          print("AQLEVON_AUTH02_MONITOR_POD",json.dumps(keep,sort_keys=True))
          PY
          code="$(curl -sS -o /tmp/status.json -w '%{http_code}' --connect-timeout 5 --max-time 10 "https://$POD_ID-8000.proxy.runpod.net/status.json?t=$(date +%s)" || true)"
          echo "AQLEVON_AUTH02_MONITOR_HTTP $code"
          if [ "$code" = "200" ]; then
            python3 - <<'PY'
          import json
          d=json.load(open("/tmp/status.json"))
          print("AQLEVON_AUTH02_MONITOR_RUNTIME",json.dumps(d,sort_keys=True))
          PY
          fi
