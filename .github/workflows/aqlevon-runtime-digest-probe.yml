name: AQLEVON Runtime Digest Probe

on:
  pull_request:
    branches:
      - ops/runpod-control-base-20260922
    paths:
      - 'ops/runpod-control/runtime-digest-probe.request.json'

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve latest immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect ghcr.io/india123445t-pixel/mus-ai:p4-a1-w03-latest --format '{{json .Manifest}}' > /tmp/manifest.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/manifest.json'))
          print("AQLEVON_RUNTIME_LATEST_DIGEST="+str(x.get("digest")))
          PY
