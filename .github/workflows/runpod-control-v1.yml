name: RunPod Control V1

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/trigger-*.json"
      - ".github/runpod-control/command.json"
  pull_request:
    branches: [ops/runpod-control-base-v1]
    paths:
      - ".github/runpod-control/trigger-*.json"
      - ".github/runpod-control/command.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Verify secret
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: test -n "${RUNPOD_API_KEY:-}"
      - name: Read status
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pods.json
          mkdir -p .github/runpod-control
          python - <<'PY'
          import json,datetime,hashlib
          raw=json.load(open('/tmp/pods.json'))
          if isinstance(raw,list):
              pods=raw
          elif isinstance(raw,dict):
              pods=raw.get('pods',raw.get('data',[]))
          else:
              pods=[]
          if isinstance(pods,dict): pods=list(pods.values())
          out={'action':'status','api':'v1','ok':True,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pod_count':len(pods or []),'pods':[]}
          for p in pods or []:
              if not isinstance(p,dict): continue
              pid=str(p.get('id',''))
              detail={}
              if pid:
                  import urllib.request
                  req=urllib.request.Request(f'https://rest.runpod.io/v1/pods/{pid}?include=machine',headers={'Authorization':'Bearer '+__import__('os').environ['RUNPOD_API_KEY']})
                  try:
                      with urllib.request.urlopen(req,timeout=15) as rr:
                          detail=json.load(rr)
                  except Exception:
                      detail={}
              m=detail.get('machine') if isinstance(detail.get('machine'),dict) else {}
              gt=m.get('gpuType') if isinstance(m.get('gpuType'),dict) else {}
              g=detail.get('gpu') if isinstance(detail.get('gpu'),dict) else {}
              gpu_fields=[detail.get('gpuTypeId'),detail.get('gpuTypeName'),m.get('gpuTypeId'),m.get('gpuDisplayName'),gt.get('id'),gt.get('displayName'),g.get('displayName'),g.get('name')]
              gpu_fields=[str(x) for x in gpu_fields if x]
              out['pods'].append({'fingerprint':hashlib.sha256(pid.encode()).hexdigest()[:12] if pid else None,'name':p.get('name'),'status':p.get('desiredStatus') or p.get('status'),'cost_per_hr':p.get('costPerHr'),'created_at':p.get('createdAt'),'volume_in_gb':p.get('volumeInGb'),'gpu_fields':gpu_fields})
          json.dump(out,open('.github/runpod-control/status.json','w'),indent=2,sort_keys=True);open('.github/runpod-control/status.json','a').write('\n')
          PY
      - name: Commit status
        run: |
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/status.json
          git commit -m "ops: record sanitized RunPod status [skip ci]" || true
          git push origin HEAD:ops/runpod-control-v1 || true
