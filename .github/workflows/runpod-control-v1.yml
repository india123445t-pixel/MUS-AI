name: RunPod Control V1

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/command.json"
      - ".github/runpod-control/trigger-*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runpod-control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1

      - name: Read command
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(jq -r '.action // "status"' .github/runpod-control/command.json)"
          if [ "$ACTION" != "status" ] && [ "$ACTION" != "inventory" ]; then
            echo "::error::Unsupported action in V1: $ACTION"
            exit 1
          fi
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"

      - name: Verify RunPod secret exists
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "::error::RUNPOD_API_KEY missing"; exit 1; }
          echo "RunPod secret present; value not printed."

      - name: Install official runpodctl for inventory
        if: env.ACTION == 'inventory'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://cli.runpod.net | bash
          export PATH="$HOME/.local/bin:$PATH"
          runpodctl version

      - name: Build sanitized inventory
        if: env.ACTION == 'inventory'
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          runpodctl config --apiKey "$RUNPOD_API_KEY" >/dev/null
          mkdir -p .github/runpod-control
          {
            echo '### REGISTRY'
            runpodctl registry list || true
            echo '### GPU'
            runpodctl gpu list || true
            echo '### PODS'
            runpodctl pod list --all || true
            echo '### CREATE_HELP'
            runpodctl pod create --help || true
          } > /tmp/inventory.txt
          python - <<'PY'
          import re, json, datetime
          text=open('/tmp/inventory.txt',encoding='utf-8',errors='replace').read()
          # Redact token-like strings and URLs with query secrets if any appear unexpectedly.
          text=re.sub(r'rpa_[A-Za-z0-9_-]+','[REDACTED_API_KEY]',text)
          text=re.sub(r'api_key=[^\s&]+','api_key=[REDACTED]',text,flags=re.I)
          out={
            "ok":True,
            "action":"inventory",
            "checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "text":text[-30000:]
          }
          open('.github/runpod-control/inventory.json','w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY

      - name: Read RunPod pod status via API v1 with machine metadata
        if: env.ACTION == 'status'
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error             --output /tmp/pods.json             --write-out "%{http_code}"             --request GET             --url "https://rest.runpod.io/v1/pods?include=machine"             --header "Authorization: Bearer ${RUNPOD_API_KEY}")"

          if [ "$CODE" != "200" ]; then
            echo "::error::RunPod v1 status query failed with HTTP $CODE"
            exit 1
          fi

          mkdir -p .github/runpod-control
          python - <<'PY'
          import json, datetime, hashlib
          with open('/tmp/pods.json','r',encoding='utf-8') as f:
              data=json.load(f)

          pods=data.get('pods', data.get('items', data.get('data', []))) if isinstance(data,dict) else (data if isinstance(data,list) else [])
          if not isinstance(pods,list):
              pods=[]

          def first(*vals):
              for v in vals:
                  if v not in (None,"",[],{}):
                      return v
              return None

          out={
              "ok": True,
              "api": "v1",
              "action": "status",
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "pod_count": len(pods),
              "pods": []
          }

          for p in pods:
              if not isinstance(p,dict):
                  continue
              pid=str(p.get('id') or '')
              fp=hashlib.sha256(pid.encode()).hexdigest()[:12] if pid else None
              machine=p.get('machine') if isinstance(p.get('machine'),dict) else {}
              gpu_type=p.get('gpuType') if isinstance(p.get('gpuType'),dict) else {}
              machine_gpu_type=machine.get('gpuType') if isinstance(machine.get('gpuType'),dict) else {}
              gpu=first(
                  p.get('gpuTypeId'),
                  p.get('gpuTypeName'),
                  gpu_type.get('displayName'),
                  gpu_type.get('id'),
                  machine.get('gpuTypeId'),
                  machine.get('gpuDisplayName'),
                  machine_gpu_type.get('displayName'),
                  machine_gpu_type.get('id')
              ) or "unknown"
              status=first(p.get('desiredStatus'),p.get('status'),p.get('runtimeStatus')) or "UNKNOWN"
              cost=first(p.get('costPerHr'),p.get('costPerHour'),p.get('pricePerHr'),machine.get('costPerHr'))
              created=first(p.get('createdAt'),p.get('created_at'),p.get('lastStartedAt'))
              runtime=p.get('runtime') if isinstance(p.get('runtime'),dict) else {}
              rgpus=runtime.get('gpus') if isinstance(runtime.get('gpus'),list) else []
              utils=[g.get('gpuUtilPercent') for g in rgpus if isinstance(g,dict) and isinstance(g.get('gpuUtilPercent'),(int,float))]
              mems=[g.get('memoryUtilPercent') for g in rgpus if isinstance(g,dict) and isinstance(g.get('memoryUtilPercent'),(int,float))]
              out["pods"].append({
                  "fingerprint": fp,
                  "status": status,
                  "gpu": gpu,
                  "cost_per_hr": cost,
                  "created_at": created,
                  "uptime_seconds": runtime.get('uptimeInSeconds'),
                  "gpu_util_percent_max": max(utils) if utils else None,
                  "gpu_memory_util_percent_max": max(mems) if mems else None
              })

          with open('.github/runpod-control/status.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write("\n")
          print(f"RUNPOD_STATUS_PASS pod_count={len(pods)}")
          PY

      - name: Commit sanitized status back to control branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aqlevon-runpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/runpod-control/status.json .github/runpod-control/inventory.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No status change to commit."
            exit 0
          fi
          git commit -m "ops: record sanitized RunPod v2 status [skip ci]"
          git push origin HEAD:ops/runpod-control-v1
