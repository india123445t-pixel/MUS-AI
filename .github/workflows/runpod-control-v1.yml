name: RunPod Control V1

on:
  push:
    branches: [ops/runpod-control-v1]
    paths:
      - ".github/runpod-control/trigger-*.json"
      - ".github/runpod-control/command.json"
  pull_request:
    branches: [ops/runpod-control-base-v1]
    paths:
      - ".github/runpod-control/trigger-*.json"
      - ".github/runpod-control/command.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
      - name: Verify secret
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: test -n "${RUNPOD_API_KEY:-}"
      - name: Read status
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pods.json
          POD_ID="$(jq -r '.. | objects | select(.name? == "AQLEVON-27B-R0-BUDGET8") | .id // empty' /tmp/pods.json | tail -n1)"
          if [ -n "$POD_ID" ]; then
            curl -sS "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer $RUNPOD_API_KEY" -o /tmp/pod-detail.json || echo '{}' >/tmp/pod-detail.json
            curl -fsS --connect-timeout 5 --max-time 10 "https://$POD_ID-8000.proxy.runpod.net/status.json" -o /tmp/runtime-status.json || echo '{}' >/tmp/runtime-status.json
          else
            echo '{}' >/tmp/pod-detail.json
            echo '{}' >/tmp/runtime-status.json
          fi
          mkdir -p .github/runpod-control
          python - <<'PY'
          import json,datetime,hashlib
          raw=json.load(open('/tmp/pods.json'))
          if isinstance(raw,list):
              pods=raw
          elif isinstance(raw,dict):
              pods=raw.get('pods',raw.get('data',[]))
          else:
              pods=[]
          if isinstance(pods,dict): pods=list(pods.values())
          out={'action':'status','api':'v1','ok':True,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pod_count':len(pods or []),'pods':[]}
          for p in pods or []:
              if not isinstance(p,dict): continue
              pid=str(p.get('id',''))
              out['pods'].append({'fingerprint':hashlib.sha256(pid.encode()).hexdigest()[:12] if pid else None,'status':p.get('desiredStatus') or p.get('status'),'container_status':p.get('containerStatus'),'gpu_type_id':p.get('gpuTypeId'),'data_center_id':p.get('dataCenterId'),'cost_per_hr':p.get('costPerHr'),'created_at':p.get('createdAt'),'last_status_change':p.get('lastStatusChange')})
          try:
              detail=json.load(open('/tmp/pod-detail.json'))
          except Exception:
              detail={}
          try:
              runtime=json.load(open('/tmp/runtime-status.json'))
          except Exception:
              runtime={}
          out['target_detail']={k:detail.get(k) for k in ('name','desiredStatus','status','containerStatus','gpuCount','gpuTypeId','dataCenterId','costPerHr','createdAt','lastStatusChange','portMappings','imageName') if k in detail}
          out['runtime_status']={k:runtime.get(k) for k in ('kind','stage','rc','detail','model_name','status','optimizer_updates','baseline_dev_successes','final_dev_successes','baseline_shadow_successes','final_shadow_successes','adapter_sha256','manifest_sha256') if k in runtime}
          json.dump(out,open('.github/runpod-control/status.json','w'),indent=2,sort_keys=True);open('.github/runpod-control/status.json','a').write('\n')
          PY
      - name: Commit status
        run: |
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/status.json
          git commit -m "ops: record sanitized RunPod status [skip ci]" || true
          git push origin HEAD:ops/runpod-control-v1 || true

  execute_27b:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1
          fetch-depth: 0
      - name: Execute AQLEVON 27B R0 only when commanded
        id: execute_27b_command
        shell: bash
        run: |
          set -euo pipefail
          action="$(jq -r '.action // ""' .github/runpod-control/command.json)"
          if [ "$action" != "execute_aqlevon_27b_r0_budget8" ]; then
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "AQLEVON_27B_COMMAND_NOT_REQUESTED"
            exit 0
          fi
          echo "requested=true" >> "$GITHUB_OUTPUT"
          bash -n .github/runpod-control/run-aqlevon-27b-r0-budget8.sh
          bash .github/runpod-control/run-aqlevon-27b-r0-budget8.sh

      - name: Preserve AQLEVON 27B R0 adapter artifact
        id: preserve_27b
        if: ${{ always() && steps.execute_27b_command.outputs.requested == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aqlevon-27b-r0-preserve-${{ github.run_id }}
          path: /tmp/aq27-r2-evidence.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Finalize AQLEVON 27B preservation and pod deletion
        if: ${{ always() && steps.execute_27b_command.outputs.requested == 'true' }}
        env:
          AQLEVON_PRESERVE_OUTCOME: ${{ steps.preserve_27b.outcome }}
          AQLEVON_ARTIFACT_ID: ${{ steps.preserve_27b.outputs.artifact-id }}
          AQLEVON_ARTIFACT_URL: ${{ steps.preserve_27b.outputs.artifact-url }}
          AQLEVON_ARTIFACT_DIGEST: ${{ steps.preserve_27b.outputs.artifact-digest }}
        run: bash .github/runpod-control/finalize-aqlevon-27b-preservation.sh
