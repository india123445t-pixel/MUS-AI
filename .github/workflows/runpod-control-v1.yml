name: RunPod Control V1

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/command.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runpod-control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1

      - name: Read command
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(jq -r '.action // "status"' .github/runpod-control/command.json)"
          if [ "$ACTION" != "status" ]; then
            echo "::error::Unsupported action in V1: $ACTION"
            exit 1
          fi

      - name: Verify RunPod secret exists
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "::error::RUNPOD_API_KEY missing"; exit 1; }
          echo "RunPod secret present; value not printed."

      - name: Read RunPod pod status and write sanitized result
        shell: bash
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error             --output /tmp/pods.json             --write-out "%{http_code}"             --request GET             --url "https://rest.runpod.io/v1/pods"             --header "Authorization: Bearer ${RUNPOD_API_KEY}")"

          if [ "$CODE" != "200" ]; then
            echo "::error::RunPod status query failed with HTTP $CODE"
            exit 1
          fi

          mkdir -p .github/runpod-control
          python - <<'PY'
          import json, datetime, hashlib
          with open('/tmp/pods.json','r',encoding='utf-8') as f:
              data=json.load(f)

          if isinstance(data, dict):
              pods=data.get('pods', data.get('items', data.get('data', [])))
              if isinstance(pods, dict):
                  pods=list(pods.values())
          elif isinstance(data, list):
              pods=data
          else:
              pods=[]

          if not isinstance(pods, list):
              pods=[]

          out={
              "ok": True,
              "action": "status",
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "pod_count": len(pods),
              "pods": []
          }

          def first(*vals):
              for v in vals:
                  if v not in (None,"",[],{}):
                      return v
              return None

          for p in pods:
              if not isinstance(p,dict):
                  continue
              pid=str(p.get('id') or '')
              fp=hashlib.sha256(pid.encode()).hexdigest()[:12] if pid else None
              machine=p.get('machine') if isinstance(p.get('machine'),dict) else {}
              gpu_obj=p.get('gpu') if isinstance(p.get('gpu'),dict) else {}
              gpu=first(
                  p.get('gpuTypeId'),
                  p.get('gpuType'),
                  p.get('gpuTypeName'),
                  gpu_obj.get('displayName'),
                  gpu_obj.get('name'),
                  machine.get('gpuDisplayName'),
                  machine.get('gpuTypeId'),
                  machine.get('gpuType'),
                  machine.get('gpuTypeName')
              ) or "unknown"
              status=first(p.get('desiredStatus'),p.get('status'),p.get('runtimeStatus')) or "UNKNOWN"
              cost=first(p.get('costPerHr'),p.get('costPerHour'),p.get('pricePerHr'))
              created=first(p.get('createdAt'),p.get('created_at'),p.get('lastStartedAt'))
              out["pods"].append({
                  "fingerprint": fp,
                  "status": status,
                  "gpu": gpu,
                  "cost_per_hr": cost,
                  "created_at": created
              })

          with open('.github/runpod-control/status.json','w',encoding='utf-8') as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write("\n")

          print(f"RUNPOD_STATUS_PASS pod_count={len(pods)}")
          PY

      - name: Commit sanitized status back to control branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aqlevon-runpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/runpod-control/status.json
          if git diff --cached --quiet; then
            echo "No status change to commit."
            exit 0
          fi
          git commit -m "ops: record sanitized RunPod status [skip ci]"
          git push origin HEAD:ops/runpod-control-v1
