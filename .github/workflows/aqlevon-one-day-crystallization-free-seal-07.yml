name: AQLEVON Auth07 Crystallization Free Seal
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/one-day-crystallization-free-trigger-07.json"]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AUTH_ID: P4-ONE-DAY-CRYSTALLIZATION-20260925-07
      AUTH_SHA: 7cdc2be72a407fed6e25333e4689c8dd26cda9f3d1a5e606f002fe4f1658c379
      SOURCE_HEAD: f3a2ca4c894e81cf9dffa1dd9935a3774b854cdb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Validate Auth07 and live provider state without spend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          bash -n .github/runpod-control/run-one-day-crystallization-07-v3.sh
          bash -n .github/runpod-control/auth07-crystallization-remote-v3.sh
          grep -q -- 'tar --no-same-owner -xzf /tmp/crystal-source.tgz' .github/runpod-control/auth07-crystallization-remote-v3.sh
          grep -q -- 'tar --owner=0 --group=0 --numeric-owner -czf /tmp/crystal-source.tgz' .github/runpod-control/run-one-day-crystallization-07-v3.sh
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('.github/runpod-control/one-day-crystallization-manager-authorization-07-20260925.json')
          a=json.loads(p.read_text())
          sha=hashlib.sha256(json.dumps({k:v for k,v in a.items() if k!='authorization_sha256'},sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert sha==a['authorization_sha256']==os.environ['AUTH_SHA']
          assert a['authorization_id']==os.environ['AUTH_ID']
          assert a['expected_source_head']==os.environ['SOURCE_HEAD']
          assert a['training_authorized'] is True and a['single_use'] is True
          assert a['training_examples']==6 and a['public_shadow_tasks']==28
          assert a['auth06_pod_deleted'] is True
          assert float(a['fresh_authorization_spend_before_auth07_usd'])+float(a['max_total_cost_usd']) <= float(a['mission_max_total_usd'])
          assert not Path('.github/runpod-control/one-day-crystallization-consumed-07.json').exists()
          print('AQLEVON_AUTH07_CONTRACT_PASS',sha)
          PY
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          curl -sSL https://cli.runpod.net | sudo bash >/dev/null
          runpodctl user >/tmp/user.json
          runpodctl gpu list --output json >/tmp/gpus.json
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          a=json.load(open('.github/runpod-control/one-day-crystallization-manager-authorization-07-20260925.json'))
          pods=json.load(open('/tmp/pods.json')); pods=pods if isinstance(pods,list) else pods.get('pods') or pods.get('items') or []
          active=[p for p in pods if str(p.get('name','')).startswith('AQLEVON-') and str(p.get('desiredStatus') or p.get('status'))!='EXITED']
          assert not active,active
          balances=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower().replace('_','') in ('balance','currentbalance','creditbalance','clientbalance') and type(v) in (int,float): balances.append(float(v))
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(json.load(open('/tmp/user.json'))); assert balances
          balance=max(balances)
          allowed=set(a['permitted_gpu_ids']); choices=[]
          for g in json.load(open('/tmp/gpus.json')):
              gid=str(g.get('gpuId',''))
              if gid not in allowed or not g.get('secureCloud'): continue
              price=float(g.get('securePricePerHr') or 999)
              if price>float(a['max_hourly_rate_usd']): continue
              for d in (g.get('dataCenterAvailability') or []):
                  if str(d.get('stockStatus')).lower()!='none' and d.get('dataCenterId'):
                      secs=min(int(a['max_billed_seconds']),int(float(a['max_total_cost_usd'])*3600/price))
                      if secs>=1200: choices.append((price,gid,str(d['dataCenterId']),secs))
          assert choices,'no_cost_safe_auth07_gpu_stock'
          price,gpu,dc,secs=sorted(choices)[0]
          out={'kind':'AQLEVON_ONE_DAY_CRYSTALLIZATION_FREE_SEAL_V2',
               'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'authorization_id':os.environ['AUTH_ID'],'authorization_sha256':os.environ['AUTH_SHA'],
               'source_head':os.environ['SOURCE_HEAD'],'balance_usd':balance,'active_aqlevon_pods':[],
               'selected_gpu_id':gpu,'selected_datacenter':dc,'selected_price_hr':price,
               'dynamic_max_billed_seconds':secs,'paid_resource_created':False}
          Path('.github/runpod-control/one-day-crystallization-free-result-07.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('AQLEVON_AUTH07_FREE_SEAL_PASS',json.dumps(out,sort_keys=True))
          PY
      - name: Persist Auth07 free seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/one-day-crystallization-free-result-07.json
          git commit -m "ops: record Auth07 crystallization free seal [skip ci]" || true
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
