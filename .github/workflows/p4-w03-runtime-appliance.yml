name: P4 W03 Runtime Appliance

on:
  workflow_dispatch:
  push:
    branches:
      - agent/03-p4-gene1-physical-trainer
      - agent/03-p4-gene1-runtime-ssh-repair-20260922
    paths:
      - 'research/weight_factory/agent03/runtime_appliance/**'
      - 'research/weight_factory/agent03/p4_patch_sdpo_transformers5_compat.py'
      - '.github/workflows/p4-w03-runtime-appliance.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: p4-w03-runtime-appliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static appliance contract
        run: |
          set -euo pipefail
          python -m py_compile research/weight_factory/agent03/runtime_appliance/smoke_runtime.py
          python - <<'PY'
          from pathlib import Path
          req=Path("research/weight_factory/agent03/runtime_appliance/requirements-p4-a1.txt").read_text()
          docker=Path("research/weight_factory/agent03/runtime_appliance/Dockerfile").read_text()
          smoke=Path("research/weight_factory/agent03/runtime_appliance/smoke_runtime.py").read_text()
          required_req=[
              "transformers==5.17.0","peft==0.21.0","accelerate==1.15.0",
              "pyarrow==22.0.0","hydra-core==1.3.2","ray[default]==2.53.0",
              "vllm==0.10.2","torchdata==0.11.0","tensordict==0.10.0",
              "datasets==4.4.2","codetiming==1.4.0",
          ]
          for x in required_req:
              assert x in req,x
          required_docker=[
              "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404",
              "7c457fc1b1f636ae794eb0362ba37d4743b06fbc",
              "flash_attn-2.8.3%2Bcu12torch2.8cxx11abi",
              "f25da18657a87fc83dc1bfb8b7751b82246e9db355510226b674fd437c34b5fb",
              "2605b2653e7b9d6615bbb154896ae4d3f0b95d3120af7a6374ee97092e61df02",
              "smoke_runtime.py --build-check",
          ]
          for x in required_docker:
              assert x in docker,x
          for x in ("AQLEVON_APPLIANCE_BUILD_CHECK_PASS","AQLEVON_APPLIANCE_GPU_CHECK_PASS","RTX 4090"):
              assert x in smoke,x
          print("APPLIANCE_STATIC_CONTRACT_PASS")
          PY

  build-publish:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk for CUDA image build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable appliance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: research/weight_factory/agent03/runtime_appliance/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/india123445t-pixel/mus-ai:p4-a1-w03-${{ github.sha }}
            ghcr.io/india123445t-pixel/mus-ai:p4-a1-w03-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: |
          set -euo pipefail
          echo "AQLEVON_APPLIANCE_IMAGE=ghcr.io/india123445t-pixel/mus-ai:p4-a1-w03-${GITHUB_SHA}"
          echo "AQLEVON_APPLIANCE_DIGEST=${{ steps.build.outputs.digest }}"
          test -n "${{ steps.build.outputs.digest }}"
