name: AQLEVON Recovered Crystallization Free Preflight
on:
  push:
    branches: [agent/03-one-day-crystallization-20260925]
    paths: ["research/weight_factory/agent03/one_day_recovered_crystallization_free_trigger.json"]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/03-one-day-crystallization-20260925
          fetch-depth: 0
      - name: Materialize recovered Auth05 discovery targets and validate crystallizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/weight_factory/agent03/p4_one_day_recovered_materializer.py
          python3 -m py_compile research/weight_factory/agent03/p4_one_day_crystallize.py
          git fetch -q origin abb94ef134e2e97036b6959dbc9db4278d3736b6
          git show abb94ef134e2e97036b6959dbc9db4278d3736b6:research/weight_factory/agent02/gene1_training_visible_pack_v1.json > /tmp/public-pack.json
          git show abb94ef134e2e97036b6959dbc9db4278d3736b6:research/weight_factory/agent02/gene1_data_verifier_pack_v1.py > /tmp/w02.py
          python3 research/weight_factory/agent03/p4_one_day_recovered_materializer.py             --recovered-decision research/weight_factory/agent03/auth05_recovered_material_decision.json             --training-pack /tmp/public-pack.json             --output /tmp/recovered-materialized-probe.json | tee /tmp/materializer.log
          grep -q 'train_targets=6 shadow_targets=0' /tmp/materializer.log
          python3 research/weight_factory/agent03/p4_one_day_crystallize.py             --probe-result /tmp/recovered-materialized-probe.json             --w02-module /tmp/w02.py             --training-pack /tmp/public-pack.json             --preflight-only | tee /tmp/crystallize-preflight.log
          grep -q 'train_verified=6 shadow=28 probe_decision=MATERIAL_LATENT_CAPABILITY' /tmp/crystallize-preflight.log
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/recovered-materialized-probe.json'))
          assert p['recovered_materialization'] is True
          assert p['sealed_eval_consumed'] is False
          assert p['worker05_used_for_tuning'] is False
          discovery=[r for r in p['records'] if r['public_split']=='discovery' and r['candidates']]
          shadow=[r for r in p['records'] if r['public_split']=='shadow']
          assert len(discovery)==6
          assert all(not r['candidates'] for r in shadow)
          assert {r['recovered_source'] for r in discovery} == {
              'auth05_rescued_task_public_oracle','auth05_pass1_task_public_oracle'
          }
          print('AQLEVON_RECOVERED_CRYSTALLIZATION_FREE_PREFLIGHT_PASS')
          PY
