name: RunPod Retry18H Free Preflight

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/retry18h-preflight-trigger-*.json"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1

      - name: Install official runpodctl binary
        shell: bash
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /usr/local/bin/runpodctl
          sudo chmod +x /usr/local/bin/runpodctl
          runpodctl version
          runpodctl user >/dev/null

      - name: Read RTX 4090 catalog only
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .github/runpod-control
          VERSION="$(runpodctl version 2>&1 || true)"
          RC=0
          runpodctl gpu list > /tmp/gpus.json 2>/tmp/gpu.err || RC=$?
          python - "$VERSION" "$RC" <<'PY'
          import json, datetime, sys
          version=sys.argv[1]
          rc=int(sys.argv[2])
          err=open('/tmp/gpu.err',encoding='utf-8',errors='replace').read()[:2000]
          raw_text=open('/tmp/gpus.json',encoding='utf-8',errors='replace').read()
          try:
              raw=json.loads(raw_text) if raw_text.strip() else None
          except Exception:
              raw=None

          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():
                      yield from walk(v)
              elif isinstance(x,list):
                  for v in x:
                      yield from walk(v)

          hits=[]
          if raw is not None:
              for d in walk(raw):
                  s=' '.join(str(d.get(k,'')) for k in (
                      'id','name','displayName','gpuTypeId','gpuTypeName'
                  ))
                  if '4090' in s:
                      keep={}
                      for k,v in d.items():
                          lk=k.lower()
                          if any(t in lk for t in ('price','cost','stock','avail','secure','community','id','name','display')):
                              if isinstance(v,(str,int,float,bool,type(None),list,dict)):
                                  keep[k]=v
                      hits.append(keep)

          out={
              'ok': rc==0,
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'runpodctl_version': version,
              'gpu_list_rc': rc,
              'rtx4090_matches': hits[:10],
              'stderr': err if rc else ''
          }
          open('.github/runpod-control/retry18h-preflight.json','w',encoding='utf-8').write(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print('RETRY18H_DIAGNOSTIC_WRITTEN', 'matches=',len(hits),'rc=',rc)
          PY

      - name: Commit sanitized preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aqlevon-runpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/runpod-control/retry18h-preflight.json
          git commit -m "ops: record Retry18H free RunPod preflight [skip ci]" || exit 0
          git pull --rebase origin ops/runpod-control-v1
          git push origin HEAD:ops/runpod-control-v1
