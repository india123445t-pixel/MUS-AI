name: Diagnose Retry18H Stopped Pod

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/retry18h-diagnostic-trigger-*.json"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1

      - name: Install runpodctl
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /usr/local/bin/runpodctl
          sudo chmod +x /usr/local/bin/runpodctl

      - name: Locate Retry18H through GraphQL and collect logs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .github/runpod-control
          cat >/tmp/q.json <<'JSON'
          {"query":"query { myself { pods { id name desiredStatus costPerHr createdAt } } }"}
          JSON
          GQL_RC=0
          curl -sS --fail -X POST "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}"             -H 'content-type: application/json' --data-binary @/tmp/q.json > /tmp/pods.json || GQL_RC=$?

          POD_ID="$(python - <<'PY'
          import json
          try: raw=json.load(open('/tmp/pods.json'))
          except Exception: raise SystemExit(0)
          pods=((raw.get('data') or {}).get('myself') or {}).get('pods') or []
          exact=[p for p in pods if isinstance(p,dict) and p.get('name')=='AQLEVON-P4-A1-R18H']
          if exact:
              exact.sort(key=lambda p:str(p.get('createdAt') or ''))
              print(exact[-1].get('id') or '')
          PY
          )"
          if [ -z "$POD_ID" ]; then
            POD_ID="$(python - <<'PY'
          import json
          try: raw=json.load(open('/tmp/pods.json'))
          except Exception: raise SystemExit(0)
          pods=((raw.get('data') or {}).get('myself') or {}).get('pods') or []
          c=[p for p in pods if isinstance(p,dict) and str(p.get('createdAt') or '').startswith('2026-09-22') and p.get('costPerHr')==0.74]
          if c:
              c.sort(key=lambda p:str(p.get('createdAt') or ''))
              print(c[-1].get('id') or '')
          PY
            )"
          fi

          LOG_RC=99
          : >/tmp/logs.jsonl
          : >/tmp/logs.err
          if [ -n "$POD_ID" ]; then
            set +e
            runpodctl pod logs "$POD_ID" --tail 500 > /tmp/logs.jsonl 2>/tmp/logs.err
            LOG_RC=$?
            set -e
          fi

          python - "$POD_ID" "$GQL_RC" "$LOG_RC" <<'PY'
          import json,sys,datetime,re,hashlib
          pid,gql_rc,log_rc=sys.argv[1],int(sys.argv[2]),int(sys.argv[3])
          fp=hashlib.sha256(pid.encode()).hexdigest()[:12] if pid else None
          lines=[]
          for raw in open('/tmp/logs.jsonl',encoding='utf-8',errors='replace'):
              raw=raw.strip()
              if not raw: continue
              try:
                  d=json.loads(raw)
                  line=str(d.get('line',''))
                  source=d.get('source')
                  ts=d.get('ts')
              except Exception:
                  line=raw; source='unknown'; ts=None
              if pid: line=line.replace(pid,'<POD_ID>')
              line=re.sub(r'rpa_[A-Za-z0-9_-]+','<REDACTED_RUNPOD_KEY>',line)
              line=re.sub(r'gh[pousr]_[A-Za-z0-9_]+','<REDACTED_GITHUB_TOKEN>',line)
              lines.append({'source':source,'ts':ts,'line':line[:4000]})
          err=open('/tmp/logs.err',encoding='utf-8',errors='replace').read()[:3000]
          if pid: err=err.replace(pid,'<POD_ID>')
          out={
              'schema_version':2,
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'pod_found':bool(pid),
              'pod_fingerprint':fp,
              'graphql_rc':gql_rc,
              'logs_rc':log_rc,
              'stderr':err,
              'lines':lines[-500:]
          }
          open('.github/runpod-control/retry18h-diagnostic.json','w',encoding='utf-8').write(
              json.dumps(out,indent=2,sort_keys=True)+'\n'
          )
          print('RETRY18H_DIAGNOSTIC_WRITTEN',out['pod_found'],len(lines))
          PY

      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aqlevon-runpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/runpod-control/retry18h-diagnostic.json
          git commit -m "ops: record Retry18H stopped-pod diagnostic [skip ci]" || exit 0
          git pull --rebase origin ops/runpod-control-v1
          git push origin HEAD:ops/runpod-control-v1
