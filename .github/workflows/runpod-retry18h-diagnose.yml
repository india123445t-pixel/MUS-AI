name: Diagnose Retry18H Stopped Pod

on:
  push:
    branches:
      - ops/runpod-control-v1
    paths:
      - ".github/runpod-control/retry18h-diagnostic-trigger-*.json"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/runpod-control-v1

      - name: Install runpodctl
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /usr/local/bin/runpodctl
          sudo chmod +x /usr/local/bin/runpodctl
          runpodctl version

      - name: Find Retry18H pod and collect sanitized logs
        shell: bash
        run: |
          set -euo pipefail
          runpodctl pod list --all > /tmp/pods.json
          python - <<'PY' > /tmp/target
          import json
          raw=json.load(open('/tmp/pods.json'))
          def walk(x):
              if isinstance(x,dict):
                  if isinstance(x.get('id'),str):
                      yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          c=[]
          for p in walk(raw):
              name=str(p.get('name') or p.get('podName') or '')
              if name == 'AQLEVON-P4-A1-R18H':
                  c.append(p)
          if not c:
              raise SystemExit('RETRY18H_POD_NOT_FOUND')
          def key(p):
              return str(p.get('createdAt') or p.get('created_at') or '')
          p=sorted(c,key=key)[-1]
          print(p['id'])
          PY
          POD_ID="$(cat /tmp/target)"
          POD_FP="$(printf '%s' "$POD_ID" | sha256sum | cut -c1-12)"

          set +e
          runpodctl pod logs "$POD_ID" --tail 500 > /tmp/logs.jsonl 2>/tmp/logs.err
          LOG_RC=$?
          set -e

          python - "$POD_ID" "$POD_FP" "$LOG_RC" <<'PY'
          import json,sys,datetime,re
          pid,fp,rc=sys.argv[1],sys.argv[2],int(sys.argv[3])
          lines=[]
          try:
              for raw in open('/tmp/logs.jsonl',encoding='utf-8',errors='replace'):
                  raw=raw.strip()
                  if not raw: continue
                  try:
                      d=json.loads(raw)
                      line=str(d.get('line',''))
                      source=d.get('source')
                      ts=d.get('ts')
                  except Exception:
                      line=raw; source='unknown'; ts=None
                  line=line.replace(pid,'<POD_ID>')
                  line=re.sub(r'rpa_[A-Za-z0-9_-]+','<REDACTED_RUNPOD_KEY>',line)
                  line=re.sub(r'gh[pousr]_[A-Za-z0-9_]+','<REDACTED_GITHUB_TOKEN>',line)
                  lines.append({'source':source,'ts':ts,'line':line[:4000]})
          except FileNotFoundError:
              pass
          err=''
          try: err=open('/tmp/logs.err',encoding='utf-8',errors='replace').read()
          except: pass
          err=err.replace(pid,'<POD_ID>')
          out={
              'schema_version':1,
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'pod_fingerprint':fp,
              'logs_rc':rc,
              'stderr':err[:3000],
              'lines':lines[-500:]
          }
          open('.github/runpod-control/retry18h-diagnostic.json','w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('DIAGNOSTIC_LINES',len(lines))
          PY

      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aqlevon-runpod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/runpod-control/retry18h-diagnostic.json
          git commit -m "ops: record Retry18H stopped-pod diagnostic [skip ci]" || exit 0
          git pull --rebase origin ops/runpod-control-v1
          git push origin HEAD:ops/runpod-control-v1
