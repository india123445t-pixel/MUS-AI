name: AQLEVON Candidate C RSFT Zero-Cost Preflight
on:
  push:
    branches: [agent/03-one-day-rsft-crystallization-20260925]
    paths:
      - "research/weight_factory/agent03/p4_one_day_rsft_crystallize.py"
      - ".github/workflows/aqlevon-one-day-rsft-candidate-c-free.yml"
      - "research/weight_factory/agent03/candidate_c_free_trigger.json"
      - ".github/runpod-control/auth09-rsft-crystallization-remote-v1.sh"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_HEAD: 529e665ea140c2f8d6b96c02a42c100e9075c037
      W02_HEAD: abb94ef134e2e97036b6959dbc9db4278d3736b6
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static scientific-firewall and schedule checks
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/weight_factory/agent03/p4_one_day_rsft_crystallize.py
          python3 -m py_compile "$SRC"
          bash -n .github/runpod-control/auth09-rsft-crystallization-remote-v1.sh
          grep -q 'source head required' .github/runpod-control/auth09-rsft-crystallization-remote-v1.sh
          grep -q 'p4_one_day_rsft_crystallize.py' .github/runpod-control/auth09-rsft-crystallization-remote-v1.sh
          grep -q '1200s' .github/runpod-control/auth09-rsft-crystallization-remote-v1.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path("research/weight_factory/agent03/p4_one_day_rsft_crystallize.py")
          s=p.read_text()
          t=ast.parse(s)
          vals={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name):
                  try: vals[n.targets[0].id]=ast.literal_eval(n.value)
                  except Exception: pass
          assert vals.get("EPOCHS")==3, vals.get("EPOCHS")
          assert vals.get("MINING_N")==8, vals.get("MINING_N")
          assert vals.get("MAX_ON_POLICY_PER_TASK")==1
          assert "for epoch in range(EPOCHS)" in s
          assert "optimizer_update_accounting_mismatch" in s
          assert "mine_discovery_on_policy" in s
          assert "public_discovery_on_policy_verifier_pass" in s
          assert "public_discovery_oracle_full_coverage" in s
          assert "AQLEVON_SEALED_EVAL_PATH" in s and "AQLEVON_EVAL_SECRET" in s
          assert '"worker05_used_for_tuning":False' in s
          assert '"sealed_eval_consumed":False' in s
          print("AQLEVON_CANDIDATE_C_STATIC_PASS epochs=3 mining_n=8")
          PY
      - name: Reconstruct PUBLIC-only training-safe probe and run preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin "$SOURCE_HEAD" "$W02_HEAD"
          git show "$SOURCE_HEAD":research/weight_factory/agent03/p4_one_day_recovered_materializer.py >/tmp/materializer.py
          git show "$SOURCE_HEAD":research/weight_factory/agent03/auth05_recovered_material_decision.json >/tmp/recovered.json
          git show "$W02_HEAD":research/weight_factory/agent02/gene1_training_visible_pack_v1.json >/tmp/public-pack.json
          git show "$W02_HEAD":research/weight_factory/agent02/gene1_data_verifier_pack_v1.py >/tmp/w02.py
          python3 /tmp/materializer.py --recovered-decision /tmp/recovered.json --training-pack /tmp/public-pack.json --output /tmp/probe.json >/tmp/materializer.log
          grep -q 'train_targets=6 shadow_targets=0' /tmp/materializer.log
          python3 research/weight_factory/agent03/p4_one_day_rsft_crystallize.py \
            --probe-result /tmp/probe.json --w02-module /tmp/w02.py \
            --training-pack /tmp/public-pack.json --preflight-only | tee /tmp/preflight.log
          grep -q 'AQLEVON_RSFT_PUBLIC_PREFLIGHT_PASS train_verified=28 shadow=28 epochs=3 minimum_updates=84 probe_decision=MATERIAL_LATENT_CAPABILITY' /tmp/preflight.log
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/public-pack.json"))
          tasks=[t for t in p["tasks"] if t.get("verifier_mode")=="hardened" and t.get("training_eligible") is True]
          assert len(tasks)==56
          # Public discovery = only indices 00-01. Public shadow = 02-03 and stays label-invisible to training.
          import re
          disc=[]; shadow=[]
          for t in tasks:
              i=int(re.search(r"-(\d{2})-hardened$",t["task_id"])[1])
              (disc if i in (0,1) else shadow).append(t)
          assert len(disc)==28 and len(shadow)==28
          assert len({t["family"] for t in disc})==14
          print("AQLEVON_CANDIDATE_C_SPLIT_FIREWALL_PASS discovery=28 shadow=28 families=14")
          PY
      - name: Confirm zero paid resources are active
        if: ${{ env.RUNPOD_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/pods.json")); xs=p if isinstance(p,list) else p.get("pods") or p.get("items") or []
          active=[x for x in xs if str(x.get("name","")).startswith("AQLEVON-") and str(x.get("desiredStatus") or x.get("status"))!="EXITED"]
          assert not active,active
          print("AQLEVON_CANDIDATE_C_NO_ACTIVE_PODS_PASS")
          PY
      - name: Final zero-cost seal
        run: echo "AQLEVON_CANDIDATE_C_ZERO_COST_PREFLIGHT_PASS"
