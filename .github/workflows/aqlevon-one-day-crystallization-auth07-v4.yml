name: AQLEVON One-Day Crystallization Auth07 V4
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/execute-one-day-crystallization-07.json"]
permissions:
  contents: write
concurrency:
  group: aqlevon-p4-paid-single-use
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Execute bounded Auth07 V4 crystallization
        shell: bash
        run: bash .github/runpod-control/run-one-day-crystallization-07-v4-wrapper.sh
      - name: Upload Auth07 V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqlevon-one-day-crystallization-auth07-v4
          path: |
            /tmp/auth07-evidence.tgz
            /tmp/auth07-train.log
            /tmp/crystal_rc
            /tmp/create07.json
            /tmp/pod07.json
            /tmp/auth07-input-sha256.txt
            /tmp/stop07.json
            /tmp/delete07.json
            /tmp/auth07-exit-stop.json
            /tmp/auth07-exit-delete.json
          if-no-files-found: warn
          retention-days: 14
