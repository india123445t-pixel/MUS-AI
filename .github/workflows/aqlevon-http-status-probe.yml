name: AQLEVON HTTP Status Probe
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/http-status-probe-trigger.json"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Read public status endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="$(python3 - <<'PY'
          import json
          print(json.load(open(".github/runpod-control/http-status-probe-trigger.json"))["status_url"])
          PY
          )"
          curl -fsS --connect-timeout 10 --max-time 20 "$url" -o /tmp/status.json
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          d=json.load(open("/tmp/status.json"))
          allowed={k:d.get(k) for k in (
            "kind","checked_at_utc","stage","rc","detail","lane","candidate_status",
            "public_shadow_gate_pass","manifest_sha256","adapter_model_sha256","adapter_state_sha256",
            "optimizer_updates","trainable_parameters","discovery_dev_gate_pass",
            "dev_pre_successes","dev_post_successes","dev_gain_tasks","dev_improvement",
            "shadow_pre_successes","shadow_post_successes","shadow_gain_tasks","shadow_improvement",
            "sealed_eval_consumed","worker05_used_for_tuning","capability_gain_claim"
          ) if k in d}
          out={"probe_checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"status":allowed}
          Path(".github/runpod-control/http-status-probe-result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/http-status-probe-result.json
          git commit -m "runtime: record public HTTP status probe [skip ci]" || true
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
