name: AQLEVON Runtime Secret Presence

on:
  push:
    branches: [release/aqlevon-unified-auth16-20260925]
    paths:
      - ".github/runpod-control/runtime-secret-presence-trigger.json"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Report presence only
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          out={
            "kind":"AQLEVON_RUNTIME_SECRET_PRESENCE_V1",
            "modal_token_id":bool(os.getenv("MODAL_TOKEN_ID")),
            "modal_token_secret":bool(os.getenv("MODAL_TOKEN_SECRET")),
            "vercel_token":bool(os.getenv("VERCEL_TOKEN")),
            "runpod_api_key":bool(os.getenv("RUNPOD_API_KEY")),
          }
          print("AQLEVON_RUNTIME_SECRET_PRESENCE",json.dumps(out,sort_keys=True))
          PY
