name: AQLEVON One-Day Crystallize A0 Free Seal
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/one-day-crystallize-a0-free-trigger-01.json"]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AUTH_ID: P4-ONE-DAY-CRYSTALLIZE-A0-20260925-01
      AUTH_SHA: a1f2aaf407c27b4fb19c4d9cf95f0b2944fc7c701652174b47dade1eb5573dd3
      EXPECTED_HEAD: 11f40e8cc7575d9094bae508a6a4d5cb84c306a4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 11f40e8cc7575d9094bae508a6a4d5cb84c306a4
          path: a0-source
          fetch-depth: 0
      - name: Validate authorization, recovered gate and trainer without spend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          test ! -e .github/runpod-control/one-day-crystallize-a0-consumed-01.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          a=json.loads(Path('.github/runpod-control/one-day-crystallize-a0-manager-authorization-01-20260925.json').read_text())
          r=json.loads(Path('.github/runpod-control/one-day-public-probe-recovered-result-05.json').read_text())
          sha=hashlib.sha256(json.dumps({k:v for k,v in a.items() if k!='authorization_sha256'},sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert sha==a['authorization_sha256']==os.environ['AUTH_SHA']
          assert a['authorization_id']==os.environ['AUTH_ID']
          assert a['expected_source_head']==os.environ['EXPECTED_HEAD']
          assert a['single_use'] is True and a['training_authorized'] is True
          assert a['worker05_evaluation_authorized'] is False and a['sealed_eval_consumed'] is False
          assert r['decision']=='MATERIAL_LATENT_CAPABILITY'
          assert r['full_56_tasks_completed_before_summary_exception'] is True
          assert float(a['fresh_mission_worst_case_after_this_auth_usd']) < float(a['owner_fresh_mission_cap_usd'])
          print('AQLEVON_CRYSTALLIZE_AUTH_AND_GATE_PASS',sha)
          PY
          test "$(git -C a0-source rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -C a0-source fetch -q origin abb94ef134e2e97036b6959dbc9db4278d3736b6
          git -C a0-source show abb94ef134e2e97036b6959dbc9db4278d3736b6:research/weight_factory/agent02/gene1_training_shard_v1.jsonl > /tmp/a0-shard.jsonl
          git -C a0-source show abb94ef134e2e97036b6959dbc9db4278d3736b6:research/weight_factory/agent02/gene1_training_shard_manifest_v1.json > /tmp/a0-manifest.json
          python3 -m py_compile a0-source/research/weight_factory/agent03/p4_a0_sft_candidate.py
          bash -n a0-source/research/weight_factory/agent03/p4_a0_runpod_launch.sh
          python3 a0-source/research/weight_factory/agent03/p4_a0_sft_candidate.py             --shard-path /tmp/a0-shard.jsonl             --manifest-path /tmp/a0-manifest.json             --plan-path a0-source/research/weight_factory/agent03/p4_frozen_training_plan_v1.json             --preflight-only
          echo AQLEVON_CRYSTALLIZE_CPU_PREFLIGHT_PASS
      - name: Verify provider state and bounded live inventory without Pod
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          curl -sSL https://cli.runpod.net | sudo bash >/dev/null
          runpodctl user >/tmp/user.json
          runpodctl gpu list --output json >/tmp/gpus.json
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          a=json.load(open('.github/runpod-control/one-day-crystallize-a0-manager-authorization-01-20260925.json'))
          pods=json.load(open('/tmp/pods.json')); pods=pods if isinstance(pods,list) else pods.get('pods') or pods.get('items') or []
          active=[p for p in pods if str(p.get('name','')).startswith('AQLEVON-') and str(p.get('desiredStatus') or p.get('status'))!='EXITED']
          assert not active,active
          balances=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower().replace('_','') in ('balance','currentbalance','creditbalance','clientbalance') and type(v) in (int,float): balances.append(float(v))
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(json.load(open('/tmp/user.json'))); assert balances
          balance=max(balances)
          allowed=a['permitted_gpu_ids']; choices=[]
          for g in json.load(open('/tmp/gpus.json')):
              gid=str(g.get('gpuId',''))
              if gid not in allowed or not g.get('secureCloud'): continue
              price=float(g.get('securePricePerHr') or 999)
              if price>float(a['max_hourly_rate_usd']): continue
              for d in (g.get('dataCenterAvailability') or []):
                  if str(d.get('stockStatus')).lower()!='none' and d.get('dataCenterId'):
                      seconds=min(int(a['max_billed_seconds']),int(float(a['max_total_cost_usd'])*3600/price))
                      if seconds>=2400: choices.append((price,allowed.index(gid),gid,d['dataCenterId'],seconds))
          assert choices,'no bounded BF16 GPU stock with >=2400s window'
          price,_,gpu,dc,seconds=sorted(choices)[0]
          out={
            'kind':'AQLEVON_ONE_DAY_CRYSTALLIZE_A0_FREE_SEAL_V1',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'authorization_id':a['authorization_id'],'authorization_sha256':a['authorization_sha256'],
            'source_head':a['expected_source_head'],'balance_usd':balance,'active_aqlevon_pods':[],
            'selected_gpu_id':gpu,'selected_datacenter':dc,'selected_price_hr':price,
            'dynamic_max_billed_seconds':seconds,'paid_resource_created':False
          }
          Path('.github/runpod-control/one-day-crystallize-a0-free-result-01.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('AQLEVON_CRYSTALLIZE_FREE_SEAL_PASS',json.dumps(out,sort_keys=True))
          PY
      - name: Persist free seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/one-day-crystallize-a0-free-result-01.json
          git commit -m "ops: record one-day crystallize A0 free seal [skip ci]" || true
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
