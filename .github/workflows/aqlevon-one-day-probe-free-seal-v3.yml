name: AQLEVON One-Day Public Probe Auth03 Free Seal
on:
  push:
    branches: [ops/one-day-verified-trajectory-20260925]
    paths: [".github/runpod-control/one-day-public-probe-free-trigger-03.json"]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AUTH_SHA: 062487f3de6bd60bafc269643bb40bb982eb39c05cfe9a99d28f3ee766098c03
      AUTH_ID: P4-ONE-DAY-PUBLIC-PASSN-20260925-03
      SOURCE_HEAD: c7b859f0a5459c1a79ea6fa96ca4adafe17599b6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/one-day-verified-trajectory-20260925
          fetch-depth: 0
      - name: Seal auth03 without spend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          a=json.loads(Path('.github/runpod-control/one-day-public-probe-manager-authorization-03-20260925.json').read_text())
          sha=hashlib.sha256(json.dumps({k:v for k,v in a.items() if k!='authorization_sha256'},sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          assert sha==a['authorization_sha256']==os.environ['AUTH_SHA']
          assert a['authorization_id']==os.environ['AUTH_ID'] and a['expected_source_head']==os.environ['SOURCE_HEAD']
          assert a['training_authorized'] is False and a['single_use'] is True and not Path('.github/runpod-control/one-day-public-probe-consumed-03.json').exists()
          assert float(a['prior_mission_spend_usd'])+float(a['max_total_cost_usd'])<float(a['mission_max_total_usd'])
          print('AQLEVON_AUTH03_CONTRACT_PASS',sha)
          PY
          test "$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/agent/03-one-day-verified-trajectory-20260925 | cut -f1)" = "$SOURCE_HEAD"
          curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/pods.json
          curl -sSL https://cli.runpod.net | sudo bash >/dev/null
          runpodctl user >/tmp/user.json
          runpodctl gpu list --output json >/tmp/gpus.json
          python3 - <<'PY'
          import datetime,json,os
          from pathlib import Path
          a=json.load(open('.github/runpod-control/one-day-public-probe-manager-authorization-03-20260925.json'))
          pods=json.load(open('/tmp/pods.json')); pods=pods if isinstance(pods,list) else pods.get('pods') or pods.get('items') or []
          active=[p for p in pods if str(p.get('name','')).startswith('AQLEVON-') and str(p.get('desiredStatus') or p.get('status'))!='EXITED']
          assert not active,active
          balances=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower().replace('_','') in ('balance','currentbalance','creditbalance','clientbalance') and type(v) in (int,float): balances.append(float(v))
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(json.load(open('/tmp/user.json'))); assert balances
          balance=max(balances); assert balance>=float(a['max_total_cost_usd'])
          choices=[]; allowed=set(a['permitted_gpu_ids'])
          for g in json.load(open('/tmp/gpus.json')):
              gid=str(g.get('gpuId',''))
              if gid not in allowed or not g.get('secureCloud'): continue
              price=float(g.get('securePricePerHr') or 999)
              if price>float(a['max_hourly_rate_usd']): continue
              for d in (g.get('dataCenterAvailability') or []):
                  if str(d.get('stockStatus')).lower()!='none': choices.append((price,gid,d.get('dataCenterId')))
          assert choices,'no_permitted_gpu_stock'
          price,gpu,dc=sorted(choices)[0]
          seconds=min(int(a['max_billed_seconds']),int(float(a['max_total_cost_usd'])*3600/price))
          assert seconds>=600
          out={'kind':'AQLEVON_ONE_DAY_PUBLIC_PROBE_FREE_SEAL_V3','checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'authorization_id':os.environ['AUTH_ID'],'authorization_sha256':os.environ['AUTH_SHA'],'source_head':os.environ['SOURCE_HEAD'],
               'balance_usd':balance,'active_aqlevon_pods':[],'selected_gpu_id':gpu,'selected_datacenter':dc,
               'selected_price_hr':price,'dynamic_max_billed_seconds':seconds,'paid_resource_created':False}
          Path('.github/runpod-control/one-day-public-probe-free-result-03.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('AQLEVON_AUTH03_FREE_SEAL_PASS',json.dumps(out,sort_keys=True))
          PY
      - name: Persist auth03 free seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-runpod-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/one-day-public-probe-free-result-03.json
          git commit -m "ops: record auth03 one-day probe free seal [skip ci]"
          git pull --rebase origin ops/one-day-verified-trajectory-20260925
          git push origin HEAD:ops/one-day-verified-trajectory-20260925
