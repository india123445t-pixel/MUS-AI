name: Workspace Sovereign Readiness CI

on:
  push:
    branches:
      - fix/workspace-readiness-truth-20260922
      - main
      - fix/public-workspace-audit-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sovereign runtime tests
        run: node --test tests/sovereign-runtime.test.mjs

      - name: Workspace truth/readiness tests
        run: node --test tests/workspace-truth-readiness.test.mjs

      - name: Public web research tests
        run: node --test tests/web-research.test.mjs

      - name: Child Lab isolation tests
        run: node --test tests/child-lab-isolation.test.mjs

      - name: Child runtime tests
        run: node --test tests/child-runtime.test.mjs

      - name: Child teaching candidate tests
        run: node --test tests/child-candidate.test.mjs

      - name: Child candidate evaluation tests
        run: node --test tests/child-eval.test.mjs

      - name: Child long-term memory tests
        run: node --test tests/child-memory.test.mjs

      - name: Child permissions tests
        run: node --test tests/child-permissions.test.mjs

      - name: Owner Core contract tests
        run: node --test tests/owner-core-dashboard.test.mjs

      - name: Security regression tests
        run: node --test tests/security-regression.test.mjs

      - name: Vercel parity command
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-placeholder
        run: npm run bos:check && npm run bos:test && npm run build

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-placeholder
        run: npm run build
