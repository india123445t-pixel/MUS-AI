name: AQLEVON Duplicate Endpoint Guard
on:
  push:
    branches: [release/aqlevon-unified-auth16-20260925]
    paths: [".github/runpod-control/duplicate-endpoint-guard-trigger.json"]
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/aqlevon-unified-auth16-20260925
      - name: Watch and remove duplicate endpoint only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}"
          removed=false
          for i in $(seq 1 100); do
            curl -fsS https://rest.runpod.io/v1/endpoints -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/endpoints.json
            id="$(python3 - <<'PY'
import json
d=json.load(open('/tmp/endpoints.json'))
xs=d if isinstance(d,list) else d.get('endpoints') or d.get('items') or []
for x in xs:
    if x.get('name')=='aqlevon-auth16-prod':
        print(x.get('id') or '')
        break
PY
)"
            if [ -n "$id" ]; then
              curl -fsS -X DELETE "https://rest.runpod.io/v1/endpoints/$id" -H "Authorization: Bearer $RUNPOD_API_KEY" >/tmp/delete.json || true
              echo "AQLEVON_DUPLICATE_ENDPOINT_REMOVED id=$id"
              removed=true
              break
            fi
            sleep 10
          done
          printf '{"kind":"AQLEVON_DUPLICATE_ENDPOINT_GUARD_V1","duplicate_name":"aqlevon-auth16-prod","canonical_endpoint_id":"tawpsv5oxepmo4","removed":%s}\n' "$removed" > .github/runpod-control/duplicate-endpoint-guard-result.json
      - name: Persist guard result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name aqlevon-release-bot
          git config user.email actions@users.noreply.github.com
          git add .github/runpod-control/duplicate-endpoint-guard-result.json
          git commit -m "ops: record duplicate endpoint guard [skip ci]" || true
          git pull --rebase origin release/aqlevon-unified-auth16-20260925 || true
          git push origin HEAD:release/aqlevon-unified-auth16-20260925 || true
