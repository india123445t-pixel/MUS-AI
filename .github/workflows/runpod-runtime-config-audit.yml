name: AQLEVON Runtime Image Config Audit

on:
  push:
    branches:
      - ops/runpod-runtime-config-audit-20260922
    paths:
      - .github/workflows/runpod-runtime-config-audit.yml

permissions:
  contents: write

env:
  IMAGE_REPO: "india123445t-pixel/mus-ai"
  IMAGE_DIGEST: "sha256:ecfe9d199a56333da7655a63a750fc6466d27fd1ed91d60aaa3e2c4b0a3dd69d"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read immutable GHCR image config without pulling layers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          repo="india123445t-pixel/mus-ai"
          digest="sha256:ecfe9d199a56333da7655a63a750fc6466d27fd1ed91d60aaa3e2c4b0a3dd69d"

          tok_url="https://ghcr.io/token?service=ghcr.io&scope="+urllib.parse.quote("repository:"+repo+":pull", safe=":")
          with urllib.request.urlopen(tok_url, timeout=30) as r:
              token=json.load(r)["token"]

          req=urllib.request.Request(
              "https://ghcr.io/v2/"+repo+"/manifests/"+digest,
              headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
              })
          with urllib.request.urlopen(req, timeout=30) as r:
              manifest=json.load(r)

          config_digest=manifest["config"]["digest"]
          req=urllib.request.Request(
              "https://ghcr.io/v2/"+repo+"/blobs/"+config_digest,
              headers={"Authorization":"Bearer "+token})
          with urllib.request.urlopen(req, timeout=30) as r:
              cfg=json.load(r)

          c=cfg.get("config",{})
          out={
              "schema_version":1,
              "image_digest":digest,
              "config_digest":config_digest,
              "entrypoint":c.get("Entrypoint"),
              "cmd":c.get("Cmd"),
              "working_dir":c.get("WorkingDir"),
              "runtime_config_read":"PASS",
              "paid_action_performed":False
          }
          import os
          os.makedirs("ops",exist_ok=True)
          with open("ops/runpod-runtime-config-audit.json","w") as f:
              json.dump(out,f,sort_keys=True,separators=(",",":"))
              f.write("\n")
          print(json.dumps(out))
          PY

      - name: Persist sanitized audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aqlevon-runpod-audit"
          git config user.email "aqlevon-runpod-audit@users.noreply.github.com"
          git add ops/runpod-runtime-config-audit.json
          git commit -m "ops: record immutable runtime image config audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
